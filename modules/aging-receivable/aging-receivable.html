<!--
==========================================================
FINOVA ACCOUNTING SYSTEM
MODULE  : AGING RECEIVABLE
FILE    : aging-receivable.html
VERSION : 3.0.0
==========================================================
-->

<div class="finova-page aging-receivable-page">


    <!-- ==================================================
         PAGE HEADER
    =================================================== -->

    <div class="finova-page-header">


        <div class="finova-page-header-left">

            <h1 class="finova-page-title">

                Aging Receivable

            </h1>

            <p class="finova-page-subtitle">

                Accounting / Aging Receivable

            </p>

        </div>


        <div class="finova-page-header-right">


            <button
                type="button"
                id="btn-download-excel-aging-receivable"
                class="btn btn-outline-success finova-btn">

                <i class="fa-solid fa-file-excel"></i>

                Download Excel

            </button>


            <button
                type="button"
                id="btn-preview-html-aging-receivable"
                class="btn btn-outline-primary finova-btn">

                <i class="fa-solid fa-print"></i>

                Preview HTML

            </button>


            <button
                type="button"
                id="btn-refresh-aging-receivable"
                class="btn btn-outline-secondary finova-btn">

                <i class="fa-solid fa-rotate"></i>

                Refresh

            </button>


        </div>

    </div>


    <!-- ==================================================
         FILTER CARD
         SAME AS AGING PAYABLE
    =================================================== -->

    <div
        class="
            finova-card
            aging-receivable-filter-card
            mb-1
        ">

        <div class="finova-card-body">

            <div class="row g-3 align-items-end">


                <!-- INVOICE DATE FROM -->

                <div class="col-md-2">

                    <label
                        for="aging-receivable-date-from"
                        class="form-label">

                        Invoice Date From

                    </label>

                    <input
                        type="date"
                        id="aging-receivable-date-from"
                        class="form-control finova-control">

                </div>


                <!-- INVOICE DATE TO -->

                <div class="col-md-2">

                    <label
                        for="aging-receivable-date-to"
                        class="form-label">

                        Invoice Date To

                    </label>

                    <input
                        type="date"
                        id="aging-receivable-date-to"
                        class="form-control finova-control">

                </div>


                <!-- SHOW -->

                <div class="col-md-2">

                    <label
                        for="aging-receivable-status"
                        class="form-label">

                        Show

                    </label>

                    <select
                        id="aging-receivable-status"
                        class="form-select finova-control">

                        <option value="all">

                            Show All Outstanding

                        </option>

                        <option value="Complete">

                            Complete

                        </option>

                        <option value="Partial Paid">

                            Partial Paid

                        </option>

                    </select>

                </div>


                <!-- FIND BY -->

                <div class="col-md-2">

                    <label
                        for="aging-receivable-find-by"
                        class="form-label">

                        Find By

                    </label>

                    <select
                        id="aging-receivable-find-by"
                        class="form-select finova-control">

                        <option value="invoice">

                            Invoice No

                        </option>

                        <option value="customer">

                            Customer

                        </option>

                        <option value="po">

                            PO No

                        </option>

                    </select>

                </div>


                <!-- KEYWORD -->

                <div class="col-md-4">

                    <label
                        for="aging-receivable-keyword"
                        class="form-label">

                        Keyword

                    </label>

                    <div class="input-group">

                        <input
                            type="text"
                            id="aging-receivable-keyword"
                            class="form-control finova-control"
                            placeholder="Search Invoice No or Customer...">

                        <button
                            type="button"
                            id="btn-find-aging-receivable"
                            class="btn btn-primary">

                            <i class="fa-solid fa-magnifying-glass me-1"></i>

                            Find

                        </button>

                    </div>

                </div>


            </div>

        </div>

    </div>


    <!-- ==================================================
         TABLE CARD
    =================================================== -->

    <div
        class="
            finova-card
            finova-table-card
            aging-receivable-table-card
        ">

        <div class="finova-card-body no-padding">

            <div class="finova-table-container">


                <div class="table-responsive">

                    <table
                        id="aging-receivable-table"
                        class="
                            table
                            finova-table
                            table-hover
                            align-middle
                            mb-0
                        ">

                        <thead>

                            <tr>

                                <th class="finova-table-index aging-ar-col-no">
                                    No
                                </th>

                                <th class="finova-table-name aging-ar-col-customer">
                                    Customer
                                </th>

                                <th class="finova-table-code aging-ar-col-invoice">
                                    Invoice No
                                </th>

                                <th class="finova-table-date aging-ar-col-date">
                                    Invoice Date
                                </th>

                                <th class="finova-table-date aging-ar-col-date">
                                    Due Date
                                </th>

                                <th class="finova-table-number aging-ar-col-amount">
                                    Outstanding
                                </th>

                                <th class="finova-table-number aging-ar-col-amount">
                                    Current
                                </th>

                                <th class="finova-table-number aging-ar-col-amount">
                                    1 - 30
                                </th>

                                <th class="finova-table-number aging-ar-col-amount">
                                    31 - 60
                                </th>

                                <th class="finova-table-number aging-ar-col-amount">
                                    61 - 90
                                </th>

                                <th class="finova-table-number aging-ar-col-amount">
                                    &gt; 90
                                </th>

                                <th class="finova-table-status aging-ar-col-status">
                                    Status
                                </th>

                            </tr>

                        </thead>


                        <tbody id="aging-receivable-tbody">
                        </tbody>


                        <tfoot>

                            <tr>

                                <th
                                    colspan="5"
                                    class="text-end">

                                    TOTAL

                                </th>

                                <th
                                    id="aging-ar-total-outstanding"
                                    class="finova-table-number">
                                    0
                                </th>

                                <th
                                    id="aging-ar-total-current"
                                    class="finova-table-number">
                                    0
                                </th>

                                <th
                                    id="aging-ar-total-1-30"
                                    class="finova-table-number">
                                    0
                                </th>

                                <th
                                    id="aging-ar-total-31-60"
                                    class="finova-table-number">
                                    0
                                </th>

                                <th
                                    id="aging-ar-total-61-90"
                                    class="finova-table-number">
                                    0
                                </th>

                                <th
                                    id="aging-ar-total-90-plus"
                                    class="finova-table-number">
                                    0
                                </th>

                                <th>
                                </th>

                            </tr>

                        </tfoot>

                    </table>

                </div>


                <!-- ==================================================
                     GLOBAL PAGINATION
                =================================================== -->

                <div class="finova-pagination-wrapper">

                    <div class="finova-pagination-left">


                        <button
                            type="button"
                            id="aging-ar-page-first"
                            class="finova-pagination-btn"
                            title="First Page"
                            disabled>

                            <i class="fa-solid fa-angles-left"></i>

                        </button>


                        <button
                            type="button"
                            id="aging-ar-page-prev"
                            class="finova-pagination-btn"
                            title="Previous Page"
                            disabled>

                            <i class="fa-solid fa-angle-left"></i>

                        </button>


                        <span class="finova-pagination-label">
                            Page
                        </span>


                        <input
                            type="number"
                            id="aging-ar-current-page"
                            class="finova-pagination-input"
                            value="1"
                            min="1"
                            step="1"
                            autocomplete="off"
                            title="Enter page number">


                        <span class="finova-pagination-label">
                            of
                        </span>


                        <span
                            id="aging-ar-total-pages"
                            class="finova-pagination-total">

                            1

                        </span>


                        <button
                            type="button"
                            id="aging-ar-page-next"
                            class="finova-pagination-btn"
                            title="Next Page"
                            disabled>

                            <i class="fa-solid fa-angle-right"></i>

                        </button>


                        <button
                            type="button"
                            id="aging-ar-page-last"
                            class="finova-pagination-btn"
                            title="Last Page"
                            disabled>

                            <i class="fa-solid fa-angles-right"></i>

                        </button>


                    </div>


                    <div
                        id="aging-ar-record-info"
                        class="finova-pagination-info">

                        Displaying Record 0 - 0 of 0

                    </div>

                </div>


            </div>

        </div>

    </div>

</div>
