<div
    class="modal fade"
    id="accountReceivablePaymentModal"
    tabindex="-1"
    data-bs-backdrop="static"
    data-bs-keyboard="false"
    aria-hidden="true">


    <div class="modal-dialog modal-lg modal-dialog-centered">


        <div class="modal-content">


            <!-- ==================================================
                 HEADER
            =================================================== -->

            <div class="modal-header">

                <div>

                    <h5
                        class="modal-title"
                        id="ar-payment-modal-title">

                        Receive Payment

                    </h5>

                    <div class="small text-muted">

                        Account Receivable Payment

                    </div>

                </div>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>

            </div>


            <!-- ==================================================
                 BODY
            =================================================== -->

            <div class="modal-body">


                <!-- ==============================================
                     HIDDEN AR ID
                =============================================== -->

                <input
                    type="hidden"
                    id="ar-payment-ar-id">


                <!-- ==============================================
                     INVOICE INFORMATION
                =============================================== -->

                <div class="border rounded p-3 mb-3">


                    <div class="row g-3">


                        <div class="col-md-6">

                            <label class="form-label">

                                Invoice No

                            </label>

                            <input
                                type="text"
                                id="ar-payment-invoice-no"
                                class="form-control"
                                readonly>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">

                                Customer

                            </label>

                            <input
                                type="text"
                                id="ar-payment-customer"
                                class="form-control"
                                readonly>

                        </div>


                        <div class="col-md-4">

                            <label class="form-label">

                                Total Invoice

                            </label>

                            <input
                                type="text"
                                id="ar-payment-total"
                                class="form-control text-end"
                                readonly>

                        </div>


                        <div class="col-md-4">

                            <label class="form-label">

                                Paid Amount

                            </label>

                            <input
                                type="text"
                                id="ar-payment-paid"
                                class="form-control text-end"
                                readonly>

                        </div>


                        <div class="col-md-4">

                            <label class="form-label">

                                Outstanding

                            </label>

                            <input
                                type="text"
                                id="ar-payment-outstanding"
                                class="form-control text-end fw-semibold"
                                readonly>

                        </div>


                    </div>


                </div>


                <!-- ==============================================
                     PAYMENT DATE
                =============================================== -->

                <div class="row g-3">


                    <div class="col-md-6">

                        <label
                            for="ar-payment-date"
                            class="form-label">

                            Payment Date
                            <span class="text-danger">*</span>

                        </label>

                        <input
                            type="date"
                            id="ar-payment-date"
                            class="form-control">

                    </div>


                    <!-- ==========================================
                         PAYMENT ACCOUNT
                    =========================================== -->

                    <div class="col-md-6">

                        <label
                            for="ar-payment-account"
                            class="form-label">

                            Bank / Cash Account
                            <span class="text-danger">*</span>

                        </label>

                        <select
                            id="ar-payment-account"
                            class="form-select">

                            <option value="">

                                Select Bank / Cash Account

                            </option>

                        </select>

                    </div>


                    <!-- ==========================================
                         PAYMENT AMOUNT
                    =========================================== -->

                    <div class="col-md-6">

                        <label
                            for="ar-payment-amount"
                            class="form-label">

                            Payment Amount
                            <span class="text-danger">*</span>

                        </label>

                        <input
                            type="text"
                            id="ar-payment-amount"
                            class="form-control text-end"
                            inputmode="numeric"
                            value="0">

                    </div>


                    <!-- ==========================================
                         REFERENCE NO
                    =========================================== -->

                    <div class="col-md-6">

                        <label
                            for="ar-payment-reference-no"
                            class="form-label">

                            Reference No

                        </label>

                        <input
                            type="text"
                            id="ar-payment-reference-no"
                            class="form-control"
                            placeholder="Transfer / receipt reference">

                    </div>


                    <!-- ==========================================
                         DESCRIPTION
                    =========================================== -->

                    <div class="col-12">

                        <label
                            for="ar-payment-description"
                            class="form-label">

                            Description

                        </label>

                        <textarea
                            id="ar-payment-description"
                            class="form-control"
                            rows="3"
                            placeholder="Payment description"></textarea>

                    </div>


                </div>


                <!-- ==============================================
                     JOURNAL PREVIEW
                =============================================== -->

                <div class="alert alert-light border mt-4 mb-0">


                    <div class="fw-semibold mb-1">

                        Journal Preview

                    </div>


                    <div class="small text-muted">

                        Debit:

                        <strong
                            id="ar-payment-preview-debit">

                            BANK / CASH

                        </strong>


                        <span class="mx-2">
                            |
                        </span>


                        Credit:

                        <strong>

                            PIUTANG USAHA

                        </strong>

                    </div>


                </div>


            </div>


            <!-- ==================================================
                 FOOTER
            =================================================== -->

            <div class="modal-footer">


                <button
                    type="button"
                    class="btn btn-outline-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>


                <button
                    type="button"
                    id="btn-save-ar-payment"
                    class="btn btn-success">

                    <i class="fa-solid fa-money-bill-wave me-1"></i>

                    Receive Payment

                </button>


            </div>


        </div>


    </div>


</div>
