<div
    class="modal fade"
    id="accountReceivablePaymentModal"
    tabindex="-1"
    data-bs-backdrop="static"
    data-bs-keyboard="false"
    aria-hidden="true"
>


    <div
        class="
            modal-dialog
            modal-lg
            modal-dialog-centered
        "
    >


        <div class="modal-content">


            <!-- ==================================================
                 HEADER
            =================================================== -->

            <div class="modal-header">


                <div>


                    <h5
                        class="modal-title"
                        id="ar-payment-modal-title"
                    >

                        <i
                            class="
                                fa-solid
                                fa-money-bill-transfer
                                me-2
                            "
                        ></i>

                        AR Payment

                    </h5>


                    <div
                        class="
                            small
                            text-muted
                            mt-1
                        "
                    >

                        Create payment for completed Account Receivable

                    </div>


                </div>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                >
                </button>


            </div>


            <!-- ==================================================
                 BODY
            =================================================== -->

            <div class="modal-body">


                <!-- ==================================================
                     HIDDEN AR ID
                =================================================== -->

                <input
                    type="hidden"
                    id="ar-payment-ar-id"
                >


                <!-- ==================================================
                     INVOICE INFORMATION
                =================================================== -->

                <div class="row g-3">


                    <!-- ==============================================
                         INVOICE NO
                    =============================================== -->

                    <div class="col-md-6">


                        <label
                            for="ar-payment-invoice-no"
                            class="form-label"
                        >

                            Invoice No

                        </label>


                        <input
                            type="text"
                            id="ar-payment-invoice-no"
                            class="form-control"
                            readonly
                        >


                    </div>


                    <!-- ==============================================
                         CUSTOMER
                    =============================================== -->

                    <div class="col-md-6">


                        <label
                            for="ar-payment-customer"
                            class="form-label"
                        >

                            Customer

                        </label>


                        <input
                            type="text"
                            id="ar-payment-customer"
                            class="form-control"
                            readonly
                        >


                    </div>


                </div>


                <!-- ==================================================
                     PAYMENT INFORMATION
                =================================================== -->

                <div class="row g-3 mt-1">


                    <!-- ==============================================
                         PAYMENT DATE
                    =============================================== -->

                    <div class="col-md-6">


                        <label
                            for="ar-payment-date"
                            class="form-label"
                        >

                            Payment Date

                            <span class="text-danger">

                                *

                            </span>

                        </label>


                        <input
                            type="date"
                            id="ar-payment-date"
                            class="form-control"
                        >


                    </div>


                    <!-- ==============================================
                         BANK ACCOUNT
                    =============================================== -->

                    <div class="col-md-6">


                        <label
                            for="ar-payment-account"
                            class="form-label"
                        >

                            Bank Account

                            <span class="text-danger">

                                *

                            </span>

                        </label>


                        <select
                            id="ar-payment-account"
                            class="form-select"
                        >

                            <option value="">

                                Select Bank Account

                            </option>

                        </select>


                    </div>


                </div>


                    <!-- ==================================================
                        PAYMENT SUMMARY
                        SAME AS ACCOUNT PAYABLE
                    =================================================== -->

                    <div
                        class="
                            ar-payment-summary
                            bg-light
                            rounded
                            p-3
                            mt-4
                        "
                    >


                        <!-- ==============================================
                            DPP
                        =============================================== -->

                        <div
                            class="
                                d-flex
                                justify-content-between
                                align-items-center
                                mb-2
                            "
                        >

                            <span class="text-muted">

                                DPP

                            </span>


                            <strong
                                id="ar-payment-dpp"
                            >

                                0

                            </strong>

                        </div>


                        <!-- ==============================================
                            TAX (+)
                        =============================================== -->

                        <div
                            class="
                                d-flex
                                justify-content-between
                                align-items-center
                                mb-2
                            "
                        >

                            <span class="text-muted">

                                Tax (+)

                            </span>


                            <strong
                                id="ar-payment-tax-plus"
                            >

                                0

                            </strong>

                        </div>


                        <!-- ==============================================
                            TAX (-)
                        =============================================== -->

                        <div
                            class="
                                d-flex
                                justify-content-between
                                align-items-center
                            "
                        >

                            <span class="text-muted">

                                Tax (-)

                            </span>


                            <strong
                                id="ar-payment-tax-minus"
                            >

                                0

                            </strong>

                        </div>


                        <hr class="my-3">


                        <!-- ==============================================
                            PAYMENT AMOUNT
                        =============================================== -->

                        <div
                            class="
                                row
                                align-items-center
                                g-3
                            "
                        >


                            <div class="col-md-6">

                                <label
                                    for="ar-payment-amount"
                                    class="
                                        form-label
                                        fw-semibold
                                        mb-1
                                    "
                                >

                                    Payment Amount

                                    <span class="text-danger">

                                        *

                                    </span>

                                </label>


                                <div
                                    class="
                                        small
                                        text-muted
                                    "
                                >

                                    Maximum payment is current outstanding.

                                </div>

                            </div>


                            <div class="col-md-6">

                                <input
                                    type="text"
                                    id="ar-payment-amount"
                                    class="
                                        form-control
                                        text-end
                                        fw-semibold
                                    "
                                    inputmode="numeric"
                                    autocomplete="off"
                                    value="0"
                                >

                            </div>


                        </div>


                    </div>

                <!-- ==================================================
                     REFERENCE NO
                     FULL WIDTH
                =================================================== -->

                <div class="row g-3 mt-1">


                    <div class="col-12">


                        <label
                            for="ar-payment-reference-no"
                            class="form-label"
                        >

                            Reference No

                        </label>


                        <input
                            type="text"
                            id="ar-payment-reference-no"
                            class="form-control"
                            placeholder="Transfer / receipt reference"
                            autocomplete="off"
                        >


                    </div>


                </div>


                <!-- ==================================================
                     DESCRIPTION
                     FULL WIDTH SEPARATE SECTION
                =================================================== -->

                <div class="row g-3 mt-1">


                    <div class="col-12">


                        <label
                            for="ar-payment-description"
                            class="form-label"
                        >

                            Description

                        </label>


                        <textarea
                            id="ar-payment-description"
                            class="
                                form-control
                                ar-payment-description
                            "
                            rows="4"
                            placeholder="Payment description"
                        ></textarea>


                    </div>


                </div>


                <!-- ==================================================
                     JOURNAL PREVIEW
                =================================================== -->

                <div
                    class="
                        ar-payment-journal-preview
                        alert
                        alert-light
                        border
                        mt-4
                        mb-0
                    "
                >


                    <div
                        class="
                            fw-semibold
                            mb-2
                        "
                    >

                        Journal Preview

                    </div>


                    <div
                        class="
                            small
                            text-muted
                        "
                    >


                        <div class="mb-1">

                            Debit:

                            <strong
                                id="ar-payment-preview-debit"
                            >

                                BANK / CASH

                            </strong>

                        </div>


                        <div class="mb-1">

                            Credit:

                            <strong>

                                PIUTANG USAHA

                            </strong>

                        </div>


                        <div>

                            Payment GL Journal will be generated as

                            <strong>

                                Draft

                            </strong>.

                        </div>


                    </div>


                </div>


            </div>


            <!-- ==================================================
                 FOOTER
            =================================================== -->

            <div class="modal-footer">


                <!-- ==============================================
                     CANCEL
                =============================================== -->

                <button
                    type="button"
                    class="btn btn-outline-secondary"
                    data-bs-dismiss="modal"
                >

                    Cancel

                </button>


                <!-- ==============================================
                     RECEIVE PAYMENT
                =============================================== -->

                <button
                    type="button"
                    id="btn-save-ar-payment"
                    class="btn btn-success"
                >

                    <i
                        class="
                            fa-solid
                            fa-money-bill-wave
                            me-1
                        "
                    ></i>

                    Receive Payment

                </button>


            </div>


        </div>


    </div>


</div>
