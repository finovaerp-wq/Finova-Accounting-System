<div
    class="modal fade"
    id="accountReceivableDetailModal"
    tabindex="-1"
    data-bs-backdrop="static"
    data-bs-keyboard="false"
    aria-hidden="true">


    <div class="modal-dialog modal-lg modal-dialog-centered">


        <div class="modal-content">


            <!-- ==================================================
                 HEADER
            =================================================== -->

            <div class="modal-header">


                <div>

                    <h5
                        class="modal-title"
                        id="account-receivable-detail-modal-title">

                        Add AR Detail

                    </h5>


                    <div
                        class="modal-subtitle text-muted small">

                        Account Receivable Invoice Detail

                    </div>

                </div>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>


            </div>


            <!-- ==================================================
                 BODY
            =================================================== -->

            <div class="modal-body">


                <!-- ==================================================
                     HIDDEN DETAIL ID
                =================================================== -->

                <input
                    type="hidden"
                    id="ar-detail-id">


                <!-- ==================================================
                     REVENUE ACCOUNT
                =================================================== -->

                <div class="mb-3">

                    <label
                        for="ar-detail-coa"
                        class="form-label">

                        Revenue Account
                        <span class="text-danger">*</span>

                    </label>


                    <select
                        id="ar-detail-coa"
                        class="form-select">

                        <option value="">
                            Select Revenue Account
                        </option>

                    </select>

                </div>


                <!-- ==================================================
                     DESCRIPTION
                =================================================== -->

                <div class="mb-3">

                    <label
                        for="ar-detail-description"
                        class="form-label">

                        Description

                    </label>


                    <textarea
                        id="ar-detail-description"
                        class="form-control"
                        rows="2"
                        placeholder="Enter description"></textarea>

                </div>


                <!-- ==================================================
                     QUANTITY / UNIT PRICE
                =================================================== -->

                <div class="row g-3">


                    <!-- ==============================================
                         QUANTITY
                    =============================================== -->

                    <div class="col-md-6">

                        <label
                            for="ar-detail-quantity"
                            class="form-label">

                            Quantity
                            <span class="text-danger">*</span>

                        </label>


                        <input
                            type="number"
                            id="ar-detail-quantity"
                            class="form-control text-start"
                            min="1"
                            step="1"
                            value="1"
                            placeholder="1">

                    </div>


                    <!-- ==============================================
                         UNIT PRICE
                    =============================================== -->

                    <div class="col-md-6">

                        <label
                            for="ar-detail-unit-price"
                            class="form-label">

                            Unit Price
                            <span class="text-danger">*</span>

                        </label>


                        <input
                            type="text"
                            id="ar-detail-unit-price"
                            class="form-control text-start"
                            inputmode="numeric"
                            value="0"
                            placeholder="0">

                    </div>


                </div>


                <!-- ==================================================
                     TAX
                =================================================== -->

                <div class="row g-3 mt-1">


                    <!-- ==============================================
                         TAX (+)
                    =============================================== -->

                    <div class="col-md-6">

                        <label
                            for="ar-detail-tax-output-rate"
                            class="form-label">

                            Tax (+)

                        </label>


                        <select
                            id="ar-detail-tax-output-rate"
                            class="form-select">

                            <option value="">
                                No Tax
                            </option>

                        </select>

                    </div>


                    <!-- ==============================================
                         TAX (-)
                    =============================================== -->

                    <div class="col-md-6">

                        <label
                            for="ar-detail-withholding-tax-rate"
                            class="form-label">

                            Tax (-)

                        </label>


                        <select
                            id="ar-detail-withholding-tax-rate"
                            class="form-select">

                            <option value="">
                                No Tax
                            </option>

                        </select>

                    </div>


                </div>


                <!-- ==================================================
                     CALCULATION SUMMARY
                =================================================== -->

                <div class="border rounded p-3 mt-4">


                    <div class="row g-3">


                        <!-- ==========================================
                             LINE AMOUNT
                        =========================================== -->

                        <div class="col-md-6">

                            <label
                                for="ar-detail-line-amount"
                                class="form-label">

                                Line Amount

                            </label>


                            <input
                                type="text"
                                id="ar-detail-line-amount"
                                class="form-control text-end"
                                value="0"
                                readonly>

                        </div>


                        <!-- ==========================================
                             TAX (+) AMOUNT
                        =========================================== -->

                        <div class="col-md-6">

                            <label
                                for="ar-detail-tax-output-amount"
                                class="form-label">

                                Tax (+) Amount

                            </label>


                            <input
                                type="text"
                                id="ar-detail-tax-output-amount"
                                class="form-control text-end"
                                value="0"
                                readonly>

                        </div>


                        <!-- ==========================================
                             TAX (-) AMOUNT
                        =========================================== -->

                        <div class="col-md-6">

                            <label
                                for="ar-detail-withholding-tax-amount"
                                class="form-label">

                                Tax (-) Amount

                            </label>


                            <input
                                type="text"
                                id="ar-detail-withholding-tax-amount"
                                class="form-control text-end"
                                value="0"
                                readonly>

                        </div>


                        <!-- ==========================================
                             TOTAL AMOUNT
                        =========================================== -->

                        <div class="col-md-6">

                            <label
                                for="ar-detail-total-amount"
                                class="form-label">

                                Total Amount

                            </label>


                            <input
                                type="text"
                                id="ar-detail-total-amount"
                                class="form-control text-end fw-semibold"
                                value="0"
                                readonly>

                        </div>


                    </div>


                </div>


                <!-- ==================================================
                     JOURNAL PREVIEW
                =================================================== -->

                <div class="alert alert-light border mt-3 mb-0">


                    <div class="fw-semibold mb-2">

                        Journal Preview

                    </div>


                    <!-- ==============================================
                         BASE JOURNAL
                    =============================================== -->

                    <div class="small text-muted mb-1">

                        Base:

                        <strong>
                            DR PIUTANG USAHA
                        </strong>

                        <span class="mx-2">
                            |
                        </span>

                        <strong>
                            CR REVENUE ACCOUNT
                        </strong>

                    </div>


                    <!-- ==============================================
                         TAX PLUS
                    =============================================== -->

                    <div class="small text-muted mb-1">

                        Tax (+):

                        <strong>
                            DR PIUTANG USAHA
                        </strong>

                        <span class="mx-2">
                            |
                        </span>

                        <strong>
                            CR TAX OUTPUT
                        </strong>

                    </div>


                    <!-- ==============================================
                         TAX MINUS
                    =============================================== -->

                    <div class="small text-muted">

                        Tax (-):

                        <strong>
                            DR WITHHOLDING TAX RECEIVABLE
                        </strong>

                        <span class="mx-2">
                            |
                        </span>

                        <strong>
                            CR PIUTANG USAHA
                        </strong>

                    </div>


                </div>


            </div>


            <!-- ==================================================
                 FOOTER
            =================================================== -->

            <div class="modal-footer">


                <button
                    type="button"
                    class="btn btn-outline-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>


                <button
                    type="button"
                    id="btn-save-ar-detail"
                    class="btn btn-primary">

                    <i class="fa-solid fa-floppy-disk me-1"></i>

                    Save Detail

                </button>


            </div>


        </div>


    </div>


</div>
