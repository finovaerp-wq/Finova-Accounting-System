<!-- ======================================================
     FINOVA ACCOUNTING SYSTEM
     MODULE : ACCOUNT RECEIVABLE
     COMPONENT : INVOICE DETAIL MODAL
====================================================== -->


<!-- ======================================================
     ACCOUNT RECEIVABLE DETAIL MODAL
====================================================== -->

<div
    class="modal fade"
    id="accountReceivableDetailModal"
    tabindex="-1"
    aria-labelledby="accountReceivableDetailModalLabel"
    aria-hidden="true"
    data-bs-backdrop="static"
    data-bs-keyboard="false">


    <div
        class="modal-dialog modal-lg modal-dialog-centered">


        <div class="modal-content shadow-lg">


            <!-- ==================================================
                 HEADER
            =================================================== -->

            <div class="modal-header">

                <div>

                    <h5
                        class="modal-title fw-semibold"
                        id="accountReceivableDetailModalLabel">

                        <i
                            class="fa-solid fa-file-invoice-dollar me-2">
                        </i>

                        Add Invoice Detail

                    </h5>


                    <div
                        class="text-muted small mt-1">

                        Add account receivable invoice detail

                    </div>

                </div>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>

            </div>


            <!-- ==================================================
                 BODY
            =================================================== -->

            <div class="modal-body">


                <!-- ==================================================
                     ACCOUNT
                =================================================== -->

                <div class="row g-3">


                    <!-- ==============================================
                         DEBIT ACCOUNT
                         PIUTANG USAHA
                    =============================================== -->

                    <div class="col-md-6">

                        <label
                            for="ar-detail-debit-account"
                            class="form-label">

                            Debit Account

                        </label>


                        <input
                            type="text"
                            id="ar-detail-debit-account"
                            class="form-control"
                            value="1-11041 - PIUTANG USAHA"
                            readonly>


                        <input
                            type="hidden"
                            id="ar-detail-debit-account-id"
                            value="155">

                    </div>


                    <!-- ==============================================
                         CREDIT / REVENUE ACCOUNT
                    =============================================== -->

                    <div class="col-md-6">

                        <label
                            for="ar-detail-coa"
                            class="form-label">

                            Credit Account
                            <span class="text-danger">*</span>

                        </label>


                        <select
                            id="ar-detail-coa"
                            class="form-select">

                            <option value=""></option>

                        </select>

                    </div>

                </div>


                <!-- ==================================================
                     DESCRIPTION
                =================================================== -->

                <div class="mb-3 mt-3">

                    <label
                        for="ar-detail-description"
                        class="form-label">

                        Description

                    </label>


                    <textarea
                        id="ar-detail-description"
                        class="form-control"
                        rows="2"
                        placeholder="Enter description"></textarea>

                </div>


                <!-- ==================================================
                     QUANTITY / UNIT PRICE
                =================================================== -->

                <div class="row g-3">


                    <!-- ==============================================
                         QUANTITY
                    =============================================== -->

                    <div class="col-md-6">

                        <label
                            for="ar-detail-quantity"
                            class="form-label">

                            Quantity
                            <span class="text-danger">*</span>

                        </label>


                        <input
                            type="number"
                            id="ar-detail-quantity"
                            class="form-control text-start"
                            min="1"
                            step="1"
                            value="1"
                            placeholder="1">

                    </div>


                    <!-- ==============================================
                         UNIT PRICE
                    =============================================== -->

                    <div class="col-md-6">

                        <label
                            for="ar-detail-unit-price"
                            class="form-label">

                            Unit Price
                            <span class="text-danger">*</span>

                        </label>


                        <input
                            type="text"
                            id="ar-detail-unit-price"
                            class="form-control text-start"
                            inputmode="numeric"
                            value="0"
                            placeholder="0">

                    </div>

                </div>


                <!-- ==================================================
                     TAX
                =================================================== -->

                <div class="row g-3 mt-1">


                    <!-- ==============================================
                         TAX (+)
                         OUTPUT TAX
                    =============================================== -->

                    <div class="col-md-6">

                        <label
                            for="ar-detail-tax-output-rate"
                            class="form-label">

                            Tax (+)

                        </label>


                        <select
                            id="ar-detail-tax-output-rate"
                            class="form-select">

                            <option value="">
                                No Tax
                            </option>

                        </select>

                    </div>


                    <!-- ==============================================
                         TAX (-)
                         WITHHOLDING TAX
                    =============================================== -->

                    <div class="col-md-6">

                        <label
                            for="ar-detail-withholding-tax-rate"
                            class="form-label">

                            Tax (-)

                        </label>


                        <select
                            id="ar-detail-withholding-tax-rate"
                            class="form-select">

                            <option value="">
                                No Tax
                            </option>

                        </select>

                    </div>

                </div>


                <!-- ==================================================
                     CALCULATION SUMMARY
                =================================================== -->

                <div
                    class="card mt-4 bg-light border-0">


                    <div class="card-body">


                        <!-- ==========================================
                             LINE AMOUNT
                        =========================================== -->

                        <div
                            class="d-flex
                                   justify-content-between
                                   align-items-center
                                   mb-2">

                            <span class="text-muted">

                                Line Amount

                            </span>


                            <span
                                id="ar-detail-line-amount"
                                class="fw-semibold">

                                0

                            </span>

                        </div>


                        <!-- ==========================================
                             TAX (+)
                        =========================================== -->

                        <div
                            class="d-flex
                                   justify-content-between
                                   align-items-center
                                   mb-2">

                            <span class="text-muted">

                                Tax (+)

                            </span>


                            <span
                                id="ar-detail-tax-output-amount"
                                class="fw-semibold">

                                0

                            </span>

                        </div>


                        <!-- ==========================================
                             TAX (-)
                        =========================================== -->

                        <div
                            class="d-flex
                                   justify-content-between
                                   align-items-center
                                   mb-2">

                            <span class="text-muted">

                                Tax (-)

                            </span>


                            <span
                                id="ar-detail-withholding-tax-amount"
                                class="fw-semibold">

                                0

                            </span>

                        </div>


                        <!-- ==========================================
                             TOTAL
                        =========================================== -->

                        <div
                            class="border-top
                                   pt-2
                                   mt-2
                                   d-flex
                                   justify-content-between
                                   align-items-center">

                            <span class="fw-semibold">

                                Total Amount

                            </span>


                            <span
                                id="ar-detail-total-amount"
                                class="fw-bold">

                                0

                            </span>

                        </div>


                    </div>

                </div>


                <!-- ==================================================
                     HIDDEN DETAIL ID
                =================================================== -->

                <input
                    type="hidden"
                    id="ar-detail-id"
                    value="">


            </div>


            <!-- ==================================================
                 FOOTER
            =================================================== -->

            <div class="modal-footer">


                <!-- ==============================================
                     CANCEL
                =============================================== -->

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    <i
                        class="fa-solid fa-xmark me-1">
                    </i>

                    Cancel

                </button>


                <!-- ==============================================
                     SAVE DETAIL
                =============================================== -->

                <button
                    type="button"
                    class="btn btn-primary"
                    id="btn-save-ar-detail">

                    <i
                        class="fa-solid fa-check me-1">
                    </i>

                    Save Detail

                </button>


            </div>


        </div>

    </div>

</div>
