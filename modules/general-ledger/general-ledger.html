<!--
==========================================================
FINOVA ACCOUNTING SYSTEM
MODULE  : GENERAL LEDGER
FILE    : general-ledger.html
VERSION : 1.0.0
==========================================================

<div class="finova-page general-ledger-page">


    <!-- ==================================================
         PAGE HEADER
    =================================================== -->

    <div class="finova-page-header">


        <!-- ==============================================
             LEFT
        =============================================== -->

        <div class="finova-page-header-left">

            <h1 class="finova-page-title">

                General Ledger

            </h1>

            <p class="finova-page-subtitle">

                Accounting / General Ledger

            </p>

        </div>


        <!-- ==============================================
             RIGHT
        =============================================== -->

        <div class="finova-page-header-right">


            <!-- DOWNLOAD EXCEL -->

            <button
                type="button"
                id="btn-download-excel-general-ledger"
                class="btn btn-outline-success finova-btn">

                <i class="fa-solid fa-file-excel"></i>

                Download Excel

            </button>


            <!-- PREVIEW HTML -->

            <button
                type="button"
                id="btn-preview-html-general-ledger"
                class="btn btn-outline-primary finova-btn">

                <i class="fa-solid fa-print"></i>

                Preview HTML

            </button>


            <!-- REFRESH -->

            <button
                type="button"
                id="btn-refresh-general-ledger"
                class="btn btn-outline-secondary finova-btn">

                <i class="fa-solid fa-rotate"></i>

                Refresh

            </button>


        </div>

    </div>


    <!-- ==================================================
         FILTER CARD
    =================================================== -->

    <div
        class="
            finova-card
            general-ledger-filter-card
            mb-1
        ">

        <div class="finova-card-body">

            <div class="row g-3 align-items-end">


                <!-- ======================================
                     DATE FROM
                ======================================= -->

                <div class="col-md-2">

                    <label
                        for="general-ledger-date-from"
                        class="form-label">

                        Accounting Date From

                    </label>

                    <input
                        type="date"
                        id="general-ledger-date-from"
                        class="form-control finova-control">

                </div>


                <!-- ======================================
                     DATE TO
                ======================================= -->

                <div class="col-md-2">

                    <label
                        for="general-ledger-date-to"
                        class="form-label">

                        Accounting Date To

                    </label>

                    <input
                        type="date"
                        id="general-ledger-date-to"
                        class="form-control finova-control">

                </div>


                <!-- ======================================
                     ACCOUNT
                ======================================= -->

                <div class="col-md-3">

                    <label
                        for="general-ledger-account"
                        class="form-label">

                        Account

                    </label>

                    <select
                        id="general-ledger-account"
                        class="form-select finova-control">

                        <option value="">

                            Show All Accounts

                        </option>

                    </select>

                </div>


                <!-- ======================================
                     FIND BY
                ======================================= -->

                <div class="col-md-2">

                    <label
                        for="general-ledger-find-by"
                        class="form-label">

                        Find By

                    </label>

                    <select
                        id="general-ledger-find-by"
                        class="form-select finova-control">

                        <option value="journal_no">

                            Journal No

                        </option>

                        <option value="description">

                            Description

                        </option>

                        <option value="business_partner">

                            Business Partner

                        </option>

                    </select>

                </div>


                <!-- ======================================
                     KEYWORD
                ======================================= -->

                <div class="col-md-3">

                    <label
                        for="general-ledger-keyword"
                        class="form-label">

                        Keyword

                    </label>

                    <div class="input-group">

                        <input
                            type="text"
                            id="general-ledger-keyword"
                            class="form-control finova-control"
                            placeholder="Search Journal No or Description...">

                        <button
                            type="button"
                            id="btn-find-general-ledger"
                            class="btn btn-primary">

                            <i
                                class="
                                    fa-solid
                                    fa-magnifying-glass
                                    me-1
                                ">
                            </i>

                            Find

                        </button>

                    </div>

                </div>


            </div>

        </div>

    </div>


    <!-- ==================================================
         TABLE CARD
    =================================================== -->

    <div
        class="
            finova-card
            finova-table-card
            general-ledger-table-card
        ">

        <div class="finova-card-body no-padding">

            <div class="finova-table-container">


                <!-- ======================================
                     TABLE
                ======================================= -->

                <div class="table-responsive">

                    <table
                        id="general-ledger-table"
                        class="
                            table
                            finova-table
                            table-hover
                            align-middle
                            mb-0
                        ">

                        <thead>

                            <tr>

                                <th class="finova-table-index glr-col-no">

                                    No

                                </th>


                                <th class="finova-table-date glr-col-date">

                                    Date

                                </th>


                                <th class="finova-table-code glr-col-journal">

                                    Journal No

                                </th>


                                <th class="finova-table-code glr-col-account">

                                    Account Code

                                </th>


                                <th class="finova-table-name glr-col-account-name">

                                    Account Name

                                </th>


                                <th class="finova-table-name glr-col-bp">

                                    Business Partner

                                </th>


                                <th class="finova-table-name glr-col-description">

                                    Description

                                </th>


                                <th class="finova-table-number glr-col-amount">

                                    Debit

                                </th>


                                <th class="finova-table-number glr-col-amount">

                                    Credit

                                </th>


                                <th class="finova-table-number glr-col-amount">

                                    Balance

                                </th>


                            </tr>

                        </thead>


                        <!-- ==================================
                             BODY
                        =================================== -->

                        <tbody id="general-ledger-tbody">

                        </tbody>


                        <!-- ==================================
                             TOTAL
                        =================================== -->

                        <tfoot>

                            <tr>

                                <th
                                    colspan="7"
                                    class="text-end">

                                    TOTAL

                                </th>


                                <th
                                    id="general-ledger-total-debit"
                                    class="finova-table-number">

                                    0

                                </th>


                                <th
                                    id="general-ledger-total-credit"
                                    class="finova-table-number">

                                    0

                                </th>


                                <th
                                    id="general-ledger-total-balance"
                                    class="finova-table-number">

                                    0

                                </th>


                            </tr>

                        </tfoot>

                    </table>

                </div>


                <!-- ==================================================
                     GLOBAL PAGINATION
                =================================================== -->

                <div class="finova-pagination-wrapper">


                    <!-- ======================================
                         LEFT
                    ======================================= -->

                    <div class="finova-pagination-left">


                        <button
                            type="button"
                            id="general-ledger-page-first"
                            class="finova-pagination-btn"
                            title="First Page"
                            disabled>

                            <i class="fa-solid fa-angles-left"></i>

                        </button>


                        <button
                            type="button"
                            id="general-ledger-page-prev"
                            class="finova-pagination-btn"
                            title="Previous Page"
                            disabled>

                            <i class="fa-solid fa-angle-left"></i>

                        </button>


                        <span class="finova-pagination-label">

                            Page

                        </span>


                        <input
                            type="number"
                            id="general-ledger-current-page"
                            class="finova-pagination-input"
                            value="1"
                            min="1"
                            step="1"
                            autocomplete="off"
                            title="Enter page number">


                        <span class="finova-pagination-label">

                            of

                        </span>


                        <span
                            id="general-ledger-total-pages"
                            class="finova-pagination-total">

                            1

                        </span>


                        <button
                            type="button"
                            id="general-ledger-page-next"
                            class="finova-pagination-btn"
                            title="Next Page"
                            disabled>

                            <i class="fa-solid fa-angle-right"></i>

                        </button>


                        <button
                            type="button"
                            id="general-ledger-page-last"
                            class="finova-pagination-btn"
                            title="Last Page"
                            disabled>

                            <i class="fa-solid fa-angles-right"></i>

                        </button>


                    </div>


                    <!-- ======================================
                         RECORD INFO
                    ======================================= -->

                    <div
                        id="general-ledger-record-info"
                        class="finova-pagination-info">

                        Displaying Record 0 - 0 of 0

                    </div>


                </div>

            </div>

        </div>

    </div>

</div>
