<!--
======================================================
FINOVA ACCOUNTING SYSTEM
MODULE : TAX MASTER
======================================================
-->

<div class="container-fluid">

    <!-- ==================================================
         HEADER
    ================================================== -->

    <div class="d-flex justify-content-between align-items-center mb-3">

        <div>

            <h4 class="fw-bold mb-1">
                <i class="fa-solid fa-percent me-2"></i>
                Tax Master
            </h4>

            <small class="text-muted">
                Manage Tax Configuration
            </small>

        </div>


        <button
            type="button"
            id="btn-add-tax"
            class="btn btn-primary">

            <i class="fa-solid fa-plus me-1"></i>

            Add Tax

        </button>

    </div>


    <!-- ==================================================
         FILTER
    ================================================== -->

    <div class="card shadow-sm mb-3">

        <div class="card-body">

            <div class="row g-2 align-items-end">

                <!-- KEYWORD -->

                <div class="col-md-4">

                    <label
                        class="form-label fw-semibold">

                        Search

                    </label>

                    <input
                        type="text"
                        id="tax-filter-keyword"
                        class="form-control"
                        placeholder="Tax Code / Tax Name / Description">

                </div>


                <!-- TYPE -->

                <div class="col-md-3">

                    <label
                        class="form-label fw-semibold">

                        Tax Type

                    </label>

                    <select
                        id="tax-filter-type"
                        class="form-select">

                        <option value="">
                            All Type
                        </option>

                        <option value="PLUS">
                            PLUS
                        </option>

                        <option value="MINUS">
                            MINUS
                        </option>

                    </select>

                </div>


                <!-- STATUS -->

                <div class="col-md-3">

                    <label
                        class="form-label fw-semibold">

                        Status

                    </label>

                    <select
                        id="tax-filter-status"
                        class="form-select">

                        <option value="">
                            All Status
                        </option>

                        <option value="true">
                            Active
                        </option>

                        <option value="false">
                            Inactive
                        </option>

                    </select>

                </div>


                <!-- ACTION -->

                <div class="col-md-2 d-flex gap-2">

                    <button
                        type="button"
                        id="btn-find-tax"
                        class="btn btn-primary flex-fill">

                        <i class="fa-solid fa-magnifying-glass me-1"></i>

                        Find

                    </button>


                    <button
                        type="button"
                        id="btn-refresh-tax"
                        class="btn btn-outline-secondary">

                        <i class="fa-solid fa-rotate"></i>

                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- ==================================================
         TABLE
    ================================================== -->

    <div class="card shadow-sm">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table
                    class="table table-hover table-bordered align-middle mb-0">

                    <thead class="table-light">

                        <tr>

                            <th
                                class="text-center"
                                style="width:60px;">

                                No.

                            </th>

                            <th>
                                Tax Code
                            </th>

                            <th>
                                Tax Name
                            </th>

                            <th
                                class="text-center">

                                Type

                            </th>

                            <th
                                class="text-end">

                                Rate

                            </th>

                            <th>
                                Tax Account
                            </th>

                            <th>
                                Offset Account
                            </th>

                            <th
                                class="text-center">

                                Status

                            </th>

                            <th
                                class="text-center"
                                style="width:110px;">

                                Action

                            </th>

                        </tr>

                    </thead>


                    <tbody id="tax-table-body">

                        <tr>

                            <td
                                colspan="9"
                                class="text-center text-muted py-4">

                                Loading...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <!-- ==================================================
             PAGINATION
        ================================================== -->

        <div class="card-footer">

            <div
                id="tax-pagination"
                class="d-flex justify-content-end gap-1">

            </div>

        </div>

    </div>

</div>


<!-- ======================================================
     TAX MODAL
====================================================== -->

<div
    class="modal fade"
    id="taxModal"
    tabindex="-1"
    aria-hidden="true">

    <div
        class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content">

            <!-- HEADER -->

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="taxModalLabel">

                    Add Tax

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">

                </button>

            </div>


            <!-- BODY -->

            <div class="modal-body">

                <form
                    id="tax-form">

                    <!-- HIDDEN ID -->

                    <input
                        type="hidden"
                        id="tax-form-id">


                    <div class="row g-3">

                        <!-- TAX CODE -->

                        <div class="col-md-6">

                            <label
                                class="form-label fw-semibold">

                                Tax Code
                                <span class="text-danger">*</span>

                            </label>

                            <input
                                type="text"
                                id="tax-form-code"
                                class="form-control"
                                placeholder="Contoh: PPN11"
                                required>

                        </div>


                        <!-- TAX NAME -->

                        <div class="col-md-6">

                            <label
                                class="form-label fw-semibold">

                                Tax Name
                                <span class="text-danger">*</span>

                            </label>

                            <input
                                type="text"
                                id="tax-form-name"
                                class="form-control"
                                placeholder="Contoh: PPN 11%"
                                required>

                        </div>


                        <!-- TAX TYPE -->

                        <div class="col-md-6">

                            <label
                                class="form-label fw-semibold">

                                Tax Type
                                <span class="text-danger">*</span>

                            </label>

                            <select
                                id="tax-form-type"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Tax Type
                                </option>

                                <option value="PLUS">
                                    PLUS
                                </option>

                                <option value="MINUS">
                                    MINUS
                                </option>

                            </select>

                        </div>


                        <!-- TAX RATE -->

                        <div class="col-md-6">

                            <label
                                class="form-label fw-semibold">

                                Tax Rate (%)
                                <span class="text-danger">*</span>

                            </label>

                            <input
                                type="number"
                                id="tax-form-rate"
                                class="form-control"
                                min="0"
                                max="100"
                                step="0.01"
                                placeholder="0.00"
                                required>

                        </div>


                        <!-- TAX ACCOUNT -->

                        <div class="col-md-6">

                            <label
                                class="form-label fw-semibold">

                                Tax Account
                                <span class="text-danger">*</span>

                            </label>

                            <select
                                id="tax-form-account"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Tax Account
                                </option>

                            </select>

                        </div>


                        <!-- OFFSET ACCOUNT -->

                        <div class="col-md-6">

                            <label
                                class="form-label fw-semibold">

                                Offset Account
                                <span class="text-danger">*</span>

                            </label>

                            <select
                                id="tax-form-offset-account"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Offset Account
                                </option>

                            </select>

                        </div>


                        <!-- DESCRIPTION -->

                        <div class="col-12">

                            <label
                                class="form-label fw-semibold">

                                Description

                            </label>

                            <textarea
                                id="tax-form-description"
                                class="form-control"
                                rows="3"
                                placeholder="Tax description...">

                            </textarea>

                        </div>


                        <!-- STATUS -->

                        <div class="col-12">

                            <div class="form-check form-switch">

                                <input
                                    type="checkbox"
                                    class="form-check-input"
                                    id="tax-form-status"
                                    checked>

                                <label
                                    class="form-check-label fw-semibold"
                                    for="tax-form-status">

                                    Active

                                </label>

                            </div>

                        </div>

                    </div>

                </form>

            </div>


            <!-- FOOTER -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>


                <button
                    type="button"
                    id="btn-save-tax"
                    class="btn btn-primary">

                    <i class="fa-solid fa-floppy-disk me-1"></i>

                    Save

                </button>

            </div>

        </div>

    </div>

</div>
