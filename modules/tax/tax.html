<div class="finova-page tax-page">

    <!-- ==========================================
         PAGE HEADER
    =========================================== -->

    <div class="finova-page-header">

        <!-- LEFT -->

        <div class="finova-page-header-left">

            <h1 class="finova-page-title">
                Tax Master
            </h1>

            <p class="finova-page-subtitle">
                Master Data / Tax Master
            </p>

        </div>


        <!-- RIGHT -->

        <div class="finova-page-header-right">

            <button
                type="button"
                id="btn-add-tax"
                class="btn btn-primary finova-btn">

                <i class="fas fa-plus"></i>
                Add Tax

            </button>


            <button
                type="button"
                id="btn-export-tax"
                class="btn btn-outline-success finova-btn">

                <i class="fas fa-file-excel"></i>
                Download Excel

            </button>


            <button
                type="button"
                id="btn-preview-tax"
                class="btn btn-outline-primary finova-btn">

                <i class="fas fa-print"></i>
                Preview HTML

            </button>


            <button
                type="button"
                id="btn-refresh-tax"
                class="btn btn-outline-secondary finova-btn">

                <i class="fas fa-rotate-right"></i>
                Refresh

            </button>

        </div>

    </div>


    <!-- ==========================================
     TOOLBAR
=========================================== -->

<div class="finova-card tax-filter-card mb-1">

    <div class="finova-card-body">

        <div class="row align-items-end g-3">

            <!-- SEARCH -->

            <div class="col-lg-5">

                <label
                    for="tax-filter-keyword"
                    class="form-label">

                    Search

                </label>

                <input
                    type="text"
                    id="tax-filter-keyword"
                    class="form-control finova-control"
                    placeholder="Search Tax Code, Tax Name or Description"
                    autocomplete="off">

            </div>


            <!-- TAX TYPE -->

            <div class="col-lg-2">

                <label
                    for="tax-filter-type"
                    class="form-label">

                    Tax Type

                </label>

                <select
                    id="tax-filter-type"
                    class="form-select finova-control">

                    <option value="">
                        All Type
                    </option>

                    <option value="PLUS">
                        PLUS
                    </option>

                    <option value="MINUS">
                        MINUS
                    </option>

                </select>

            </div>


            <!-- STATUS -->

            <div class="col-lg-2">

                <label
                    for="tax-filter-status"
                    class="form-label">

                    Status

                </label>

                <select
                    id="tax-filter-status"
                    class="form-select finova-control">

                    <option value="">
                        All Status
                    </option>

                    <option value="true">
                        Active
                    </option>

                    <option value="false">
                        Inactive
                    </option>

                </select>

            </div>

        </div>

    </div>

</div>

    <!-- ==========================================
         DATA TABLE
    =========================================== -->

    <div class="finova-card finova-table-card tax-table-card">

        <div class="finova-card-body no-padding">

            <div class="finova-table-container">

                <!-- ==========================================
                     TABLE
                =========================================== -->

                <div class="table-responsive">

                    <table class="table finova-table table-hover">

                        <thead class="finova-table-header">

                            <tr>

                                <th
                                    class="text-center"
                                    style="width:60px">

                                    No

                                </th>


                                <th
                                    class="finova-table-code"
                                    style="width:120px">

                                    Tax Code

                                </th>


                                <th class="finova-table-name">

                                    Tax Name

                                </th>


                                <th
                                    class="text-center"
                                    style="width:100px">

                                    Type

                                </th>


                                <th
                                    class="text-end"
                                    style="width:100px">

                                    Rate

                                </th>


                                <th>

                                    Tax Account

                                </th>


                                <th>

                                    Offset Account

                                </th>


                                <th
                                    class="finova-table-status"
                                    style="width:110px">

                                    Status

                                </th>


                                <th
                                    class="finova-table-action"
                                    style="width:110px">

                                    Action

                                </th>

                            </tr>

                        </thead>


                        <tbody id="tax-table-body">

                            <tr>

                                <td colspan="9">

                                    <div class="finova-empty">

                                        <i class="fas fa-folder-open"></i>

                                        <h5>
                                            No Tax Data Found
                                        </h5>

                                        <p>
                                            Click
                                            <strong>Add Tax</strong>
                                            to create your first Tax.
                                        </p>

                                    </div>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>


                <!-- ==========================================
                     GLOBAL PAGINATION
                =========================================== -->

                <div class="finova-pagination-wrapper">

                    <div class="finova-pagination-left">

                        <!-- FIRST -->

                        <button
                            type="button"
                            id="tax-pagination-first"
                            class="finova-pagination-btn"
                            title="First Page">

                            <i class="fa-solid fa-backward-step"></i>

                        </button>


                        <!-- PREVIOUS -->

                        <button
                            type="button"
                            id="tax-pagination-prev"
                            class="finova-pagination-btn"
                            title="Previous Page">

                            <i class="fa-solid fa-chevron-left"></i>

                        </button>


                        <!-- PAGE -->

                        <span class="finova-pagination-label">

                            Page

                        </span>


                        <!-- CURRENT PAGE -->

                        <input
                            type="number"
                            id="tax-pagination-page-input"
                            class="form-control finova-pagination-input"
                            value="1"
                            min="1"
                            autocomplete="off">


                        <!-- OF -->

                        <span class="finova-pagination-label">

                            of

                        </span>


                        <!-- TOTAL PAGE -->

                        <span
                            id="tax-pagination-total-pages"
                            class="finova-pagination-total">

                            1

                        </span>


                        <!-- NEXT -->

                        <button
                            type="button"
                            id="tax-pagination-next"
                            class="finova-pagination-btn"
                            title="Next Page">

                            <i class="fa-solid fa-chevron-right"></i>

                        </button>


                        <!-- LAST -->

                        <button
                            type="button"
                            id="tax-pagination-last"
                            class="finova-pagination-btn"
                            title="Last Page">

                            <i class="fa-solid fa-forward-step"></i>

                        </button>

                    </div>


                    <!-- RECORD INFO -->

                    <div
                        id="tax-pagination-info"
                        class="finova-pagination-info">

                        Displaying Record 0 - 0 of 0

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- ======================================================
     TAX MODAL
====================================================== -->

<div
    class="modal fade"
    id="taxModal"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content">

            <!-- ==========================================
                 HEADER
            =========================================== -->

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="taxModalLabel">

                    Add Tax

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>

            </div>


            <!-- ==========================================
                 BODY
            =========================================== -->

            <div class="modal-body">

                <form id="tax-form">

                    <!-- HIDDEN ID -->

                    <input
                        type="hidden"
                        id="tax-form-id">


                    <div class="row g-3">

                        <!-- TAX CODE -->

                        <div class="col-md-6">

                            <label
                                for="tax-form-code"
                                class="form-label fw-semibold">

                                Tax Code
                                <span class="text-danger">*</span>

                            </label>

                            <input
                                type="text"
                                id="tax-form-code"
                                class="form-control"
                                placeholder="Contoh: PPN11"
                                required>

                        </div>


                        <!-- TAX NAME -->

                        <div class="col-md-6">

                            <label
                                for="tax-form-name"
                                class="form-label fw-semibold">

                                Tax Name
                                <span class="text-danger">*</span>

                            </label>

                            <input
                                type="text"
                                id="tax-form-name"
                                class="form-control"
                                placeholder="Contoh: PPN 11%"
                                required>

                        </div>


                        <!-- TAX TYPE -->

                        <div class="col-md-6">

                            <label
                                for="tax-form-type"
                                class="form-label fw-semibold">

                                Tax Type
                                <span class="text-danger">*</span>

                            </label>

                            <select
                                id="tax-form-type"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Tax Type
                                </option>

                                <option value="PLUS">
                                    PLUS
                                </option>

                                <option value="MINUS">
                                    MINUS
                                </option>

                            </select>

                        </div>


                        <!-- TAX RATE -->

                        <div class="col-md-6">

                            <label
                                for="tax-form-rate"
                                class="form-label fw-semibold">

                                Tax Rate (%)
                                <span class="text-danger">*</span>

                            </label>

                            <input
                                type="number"
                                id="tax-form-rate"
                                class="form-control"
                                min="0"
                                max="100"
                                step="0.01"
                                placeholder="0.00"
                                required>

                        </div>


                        <!-- TAX ACCOUNT -->

                        <div class="col-md-6">

                            <label
                                for="tax-form-account"
                                class="form-label fw-semibold">

                                Tax Account
                                <span class="text-danger">*</span>

                            </label>

                            <select
                                id="tax-form-account"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Tax Account
                                </option>

                            </select>

                        </div>


                        <!-- OFFSET ACCOUNT -->

                        <div class="col-md-6">

                           <label
    for="tax-form-offset-account"
    class="form-label">

    Offset Account
    <span class="text-muted">(Optional)</span>

</label>

<select
    id="tax-form-offset-account"
    class="form-select finova-control">

    <option value="">
        Select Offset Account
    </option>

</select>
                               

                        </div>


                        <!-- DESCRIPTION -->

                        <div class="col-12">

                            <label
                                for="tax-form-description"
                                class="form-label fw-semibold">

                                Description

                            </label>

                            <textarea
                                id="tax-form-description"
                                class="form-control"
                                rows="3"
                                placeholder="Tax description..."></textarea>

                        </div>


                        <!-- STATUS -->

                        <div class="col-12">

                            <div class="form-check form-switch">

                                <input
                                    type="checkbox"
                                    class="form-check-input"
                                    id="tax-form-status"
                                    checked>

                                <label
                                    class="form-check-label fw-semibold"
                                    for="tax-form-status">

                                    Active

                                </label>

                            </div>

                        </div>

                    </div>

                </form>

            </div>


            <!-- ==========================================
                 FOOTER
            =========================================== -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>


                <button
                    type="button"
                    id="btn-save-tax"
                    class="btn btn-primary">

                    <i class="fa-solid fa-floppy-disk me-1"></i>

                    Save

                </button>

            </div>

        </div>

    </div>

</div>
