<!-- ==========================================================
     ADD / EDIT CHART OF ACCOUNT
=========================================================== -->

<div
    class="modal fade"
    id="coa-modal"
    tabindex="-1"
    data-bs-backdrop="static"
    data-bs-keyboard="false">

    <div class="modal-dialog modal-xl">

        <div class="modal-content">


            <!-- ==================================================
                 HEADER
            =================================================== -->

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="coa-modal-title">

                    Add Chart Of Account

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>

            </div>


            <!-- ==================================================
                 BODY
            =================================================== -->

            <div class="modal-body">

                <form id="coa-form">

                    <input
                        type="hidden"
                        id="coa-id">


                    <div class="row g-3">


                        <!-- ==========================================
                             PARENT ACCOUNT
                        =========================================== -->

                        <div class="col-md-6">

                            <label
                                for="parent-account"
                                class="form-label">

                                Parent Account

                            </label>

                            <select
                                id="parent-account"
                                class="form-select">

                                <option value="">
                                    No Parent Account
                                </option>

                            </select>


                            <div class="mt-2 text-muted small">

                                Child Accounts:

                                <span
                                    id="parent-child-count">

                                    -

                                </span>

                            </div>

                        </div>


                        <!-- ==========================================
                             ACCOUNT CODE
                        =========================================== -->

                        <div class="col-md-6">

                            <label
                                for="account-code"
                                class="form-label">

                                Account Code

                                <span class="text-danger">
                                    *
                                </span>

                            </label>

                            <input
                                type="text"
                                id="account-code"
                                class="form-control"
                                autocomplete="off"
                                required>

                        </div>


                        <!-- ==========================================
                             ACCOUNT NAME
                        =========================================== -->

                        <div class="col-md-6">

                            <label
                                for="account-name"
                                class="form-label">

                                Account Name

                                <span class="text-danger">
                                    *
                                </span>

                            </label>

                            <input
                                type="text"
                                id="account-name"
                                class="form-control"
                                autocomplete="off"
                                required>

                        </div>


                        <!-- ==========================================
                             ACCOUNT CATEGORY
                        =========================================== -->

                        <div class="col-md-6">

                            <label
                                for="account-category"
                                class="form-label">

                                Account Category

                            </label>

                            <select
                                id="account-category"
                                class="form-select">

                                <option value="">
                                    Select Category
                                </option>

                            </select>

                        </div>


                        <!-- ==========================================
                             CURRENCY
                        =========================================== -->

                        <div class="col-md-6">

                            <label
                                for="currency"
                                class="form-label">

                                Currency

                            </label>

                            <select
                                id="currency"
                                class="form-select">

                                <option value="IDR">
                                    IDR
                                </option>

                                <option value="USD">
                                    USD
                                </option>

                            </select>

                        </div>


                        <!-- ==========================================
                             NORMAL BALANCE
                        =========================================== -->

                        <div class="col-md-6">

                            <label
                                for="normal-balance"
                                class="form-label">

                                Normal Balance

                            </label>

                            <select
                                id="normal-balance"
                                class="form-select">

                                <option value="Debit">
                                    Debit
                                </option>

                                <option value="Credit">
                                    Credit
                                </option>

                            </select>

                        </div>


                        <!-- ==========================================
                             DESCRIPTION
                        =========================================== -->

                        <div class="col-md-12">

                            <label
                                for="description"
                                class="form-label">

                                Description

                            </label>

                            <textarea
                                id="description"
                                class="form-control"
                                rows="3"></textarea>

                        </div>


                    </div>

                </form>

            </div>


            <!-- ==================================================
                 FOOTER
            =================================================== -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>


                <button
                    type="button"
                    id="btn-save-coa"
                    class="btn btn-primary">

                    <i
                        class="fa-solid fa-floppy-disk me-1">
                    </i>

                    Save

                </button>

            </div>


        </div>

    </div>

</div>



<!-- ==========================================================
     DELETE CHART OF ACCOUNT CONFIRMATION
=========================================================== -->

<div
    class="modal fade"
    id="coaDeleteModal"
    tabindex="-1"
    aria-labelledby="coaDeleteModalLabel"
    aria-hidden="true">

    <div
        class="modal-dialog modal-dialog-centered">

        <div class="modal-content shadow-lg">


            <!-- ==================================================
                 HEADER
            =================================================== -->

            <div class="modal-header">

                <h5
                    class="modal-title fw-semibold"
                    id="coaDeleteModalLabel">

                    <i
                        class="fa-solid fa-trash text-danger me-2">
                    </i>

                    Confirm Delete Chart Of Account

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>

            </div>


            <!-- ==================================================
                 BODY
            =================================================== -->

            <div class="modal-body">

                <div class="text-center">


                    <!-- ==================================================
                         DELETE ICON
                    =================================================== -->

                    <div class="mb-3">

                        <i
                            class="fa-solid fa-trash-can text-danger"
                            style="font-size: 48px;">
                        </i>

                    </div>


                    <!-- ==================================================
                         QUESTION
                    =================================================== -->

                    <div
                        class="mb-3"
                        style="font-size: 16px;">

                        Apakah Anda yakin ingin

                        <strong>
                            menghapus Chart Of Account ini?
                        </strong>

                    </div>


                    <!-- ==================================================
                         COA INFORMATION
                    =================================================== -->

                    <div
                        class="table-responsive text-start mb-3">

                        <table
                            class="table table-sm table-bordered mb-0">

                            <tbody>


                                <!-- ACCOUNT CODE -->

                                <tr>

                                    <th
                                        style="width: 150px;">

                                        Account Code

                                    </th>

                                    <td
                                        id="coa-delete-code">

                                        -

                                    </td>

                                </tr>


                                <!-- ACCOUNT NAME -->

                                <tr>

                                    <th>

                                        Account Name

                                    </th>

                                    <td
                                        id="coa-delete-name">

                                        -

                                    </td>

                                </tr>


                                <!-- CURRENCY -->

                                <tr>

                                    <th>

                                        Currency

                                    </th>

                                    <td
                                        id="coa-delete-currency">

                                        -

                                    </td>

                                </tr>


                            </tbody>

                        </table>

                    </div>


                    <!-- ==================================================
                         WARNING
                    =================================================== -->

                    <div
                        class="alert alert-danger text-start mb-0">

                        <i
                            class="fa-solid fa-triangle-exclamation me-2">
                        </i>

                        Chart Of Account yang dihapus
                        tidak dapat dikembalikan.

                    </div>


                </div>

            </div>


            <!-- ==================================================
                 FOOTER
            =================================================== -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    <i
                        class="fa-solid fa-xmark me-1">
                    </i>

                    Batal

                </button>


                <button
                    type="button"
                    class="btn btn-danger"
                    id="btn-confirm-coa-delete">

                    <i
                        class="fa-solid fa-trash me-1">
                    </i>

                    Ya, Hapus

                </button>

            </div>


        </div>

    </div>

</div>
