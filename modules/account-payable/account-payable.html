<div class="container-fluid ap-page">

    <!-- ==================================================
         PAGE HEADER
    =================================================== -->

    <div class="d-flex
                justify-content-between
                align-items-center
                mb-3">

        <!-- ==============================================
             PAGE TITLE
        =============================================== -->

        <div>

            <h5 class="mb-1">

                <i class="fa-solid fa-file-invoice-dollar me-2"></i>

                Account Payable

            </h5>

            <div class="text-muted small">

                Accounting / Account Payable

            </div>

        </div>


        <!-- ==============================================
             TOOLBAR
        =============================================== -->

        <div class="d-flex align-items-center gap-2">

            <!-- ADD AP -->

            <button
                type="button"
                id="btn-add-ap"
                class="btn btn-primary">

                <i class="fa-solid fa-plus me-2"></i>

                Add AP

            </button>


            <!-- DOWNLOAD EXCEL -->

            <button
                type="button"
                id="btn-download-excel-ap"
                class="btn btn-outline-success">

                <i class="fa-solid fa-file-excel me-2"></i>

                Download Excel

            </button>


            <!-- PREVIEW HTML -->

            <button
                type="button"
                id="btn-preview-html-ap"
                class="btn btn-outline-primary">

                <i class="fa-solid fa-print me-2"></i>

                Preview HTML

            </button>


            <!-- REFRESH -->

            <button
                type="button"
                id="btn-refresh-ap"
                class="btn btn-outline-secondary"
                title="Refresh">

                <i class="fa-solid fa-rotate me-2"></i>

                Refresh

            </button>

        </div>

    </div>


    <!-- ==================================================
         FILTER CARD
    =================================================== -->

    <div class="card shadow-sm border-0 rounded-4 mb-0">

        <div class="card-body">

            <div class="row g-3 align-items-end">


                <!-- ======================================
                     INVOICE DATE FROM
                ======================================= -->

                <div class="col-md-2">

                    <label
                        for="ap-date-from"
                        class="form-label fw-semibold">

                        Invoice Date From

                    </label>

                    <input
                        type="date"
                        id="ap-date-from"
                        class="form-control">

                </div>


                <!-- ======================================
                     INVOICE DATE TO
                ======================================= -->

                <div class="col-md-2">

                    <label
                        for="ap-date-to"
                        class="form-label fw-semibold">

                        Invoice Date To

                    </label>

                    <input
                        type="date"
                        id="ap-date-to"
                        class="form-control">

                </div>


                <!-- ======================================
                     SHOW
                ======================================= -->

                <div class="col-md-2">

                    <label
                        for="ap-status-filter"
                        class="form-label fw-semibold">

                        Show

                    </label>

                    <select
                        id="ap-status-filter"
                        class="form-select">

                        <option value="all">

                            Show All Data

                        </option>

                        <option value="not_completed">

                            Show Not Completed Only

                        </option>

                        <option value="completed">

                            Show Completed Only

                        </option>

                    </select>

                </div>


                <!-- ======================================
                     FIND BY
                ======================================= -->

                <div class="col-md-2">

                    <label
                        for="ap-find-by"
                        class="form-label fw-semibold">

                        Find By

                    </label>

                    <select
                        id="ap-find-by"
                        class="form-select">

                        <option value="invoice_no">

                            Invoice No

                        </option>

                        <option value="vendor">

                            Vendor

                        </option>

                    </select>

                </div>


                <!-- ======================================
                     KEYWORD
                ======================================= -->

                <div class="col-md-4">

                    <label
                        for="ap-keyword"
                        class="form-label fw-semibold">

                        Keyword

                    </label>

                    <div class="input-group">

                        <input
                            type="text"
                            id="ap-keyword"
                            class="form-control"
                            placeholder="Search Invoice No or Vendor...">

                        <button
                            type="button"
                            id="btn-find-ap"
                            class="btn btn-primary">

                            <i class="fa-solid fa-magnifying-glass me-1"></i>

                            Find

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- ==================================================
         AP DATA TABLE
    =================================================== -->

    <div class="finova-table-card card shadow-sm border-0 rounded-4">

    <div class="finova-card-body card-body p-0">

            <div class="finova-table-container">

            <div class="table-responsive">

                <table
                    
                    class="finova-table table-hover">

                    <!-- ==================================
                         TABLE HEADER
                    =================================== -->

                    <thead>

                        <tr>

                            <th
                                class="text-center"
                                style="width: 60px;">

                                No

                            </th>


                            <th
                                style="min-width: 140px;">

                                Invoice No

                            </th>


                            <th
                                style="min-width: 200px;">

                                Vendor

                            </th>


                            <th
                                style="min-width: 130px;">

                                PO No

                            </th>


                            <th
                                style="min-width: 130px;">

                                Invoice Date

                            </th>


                            <th
                                style="min-width: 130px;">

                                Due Date

                            </th>


                            <th
                                class="text-end"
                                style="min-width: 150px;">

                                Total Amount

                            </th>


                            <th
                                class="text-end"
                                style="min-width: 150px;">

                                Outstanding

                            </th>


                            <th
                                class="text-center"
                                style="min-width: 110px;">

                                Status

                            </th>


                            <th
                                class="text-center"
                                style="min-width: 150px;">

                                Action

                            </th>

                        </tr>

                    </thead>


                    <!-- ==================================
                         TABLE BODY
                    =================================== -->

                    <tbody id="ap-table-body">

                        <!--
                        ==================================================
                        DATA ROWS WILL BE RENDERED BY
                        account-payable.js
                        ==================================================
                        -->

                    </tbody>

                </table>

            </div>

        </div>
        </div>


        <!-- ==================================================
     PAGINATION FOOTER
=================================================== -->

<div
    class="card-footer bg-white border-0">

    <div
        class="d-flex
               justify-content-between
               align-items-center">


        <!-- ==========================================
             PAGINATION CONTROL
        =========================================== -->

        <div
            class="d-flex
                   align-items-center
                   gap-2">


            <!-- ======================================
                 FIRST PAGE
            ======================================= -->

            <button
                type="button"
                id="ap-page-first"
                class="btn btn-light border"
                title="First Page"
                disabled>

                <i class="fa-solid fa-backward-step"></i>

            </button>


            <!-- ======================================
                 PREVIOUS PAGE
            ======================================= -->

            <button
                type="button"
                id="ap-page-prev"
                class="btn btn-light border"
                title="Previous Page"
                disabled>

                <i class="fa-solid fa-chevron-left"></i>

            </button>


            <!-- ======================================
                 PAGE LABEL
            ======================================= -->

            <span class="ms-1">

                Page

            </span>


            <!-- ======================================
                 DIRECT PAGE INPUT
            ======================================= -->

            <input
                type="number"
                id="ap-current-page"
                class="form-control text-center"
                value="1"
                min="1"
                style="
                    width: 42px;
                    height: 32px;
                    padding: 0;
                "
                title="Enter page number">


            <!-- ======================================
                 TOTAL PAGE
            ======================================= -->

            <span>

                of

            </span>


            <span
                id="ap-total-pages">

                1

            </span>


            <!-- ======================================
                 NEXT PAGE
            ======================================= -->

            <button
                type="button"
                id="ap-page-next"
                class="btn btn-light border"
                title="Next Page"
                disabled>

                <i class="fa-solid fa-chevron-right"></i>

            </button>


            <!-- ======================================
                 LAST PAGE
            ======================================= -->

            <button
                type="button"
                id="ap-page-last"
                class="btn btn-light border"
                title="Last Page"
                disabled>

                <i class="fa-solid fa-forward-step"></i>

            </button>

        </div>


        <!-- ==========================================
             RECORD INFORMATION
        =========================================== -->

        <div
            id="ap-record-info"
            class="text-muted">

            Records 0 - 0 of 0

        </div>

    </div>

</div>
