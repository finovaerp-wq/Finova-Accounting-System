<div class="finova-page account-payable-page">

    <!-- ==================================================
         PAGE HEADER
    =================================================== -->

    <div class="finova-page-header">

        <div class="finova-page-header-left">

            <h1 class="finova-page-title">
                Account Payable
            </h1>

            <p class="finova-page-subtitle">
                Accounting / Account Payable
            </p>

        </div>


        <div class="finova-page-header-right">

            <button
                type="button"
                id="btn-add-ap"
                class="btn btn-primary finova-btn">

                <i class="fa-solid fa-plus"></i>
                Add AP

            </button>


            <button
                type="button"
                id="btn-vendor-payment-trace-ap"
                class="btn btn-outline-primary finova-btn">

                <i class="fa-solid fa-route"></i>
                Vendor Payment Trace

            </button>


            <button
                type="button"
                id="btn-download-excel-ap"
                class="btn btn-outline-success finova-btn">

                <i class="fa-solid fa-file-excel"></i>
                Download Excel

            </button>


            <button
                type="button"
                id="btn-preview-html-ap"
                class="btn btn-outline-primary finova-btn">

                <i class="fa-solid fa-print"></i>
                Preview HTML

            </button>


            <button
                type="button"
                id="btn-refresh-ap"
                class="btn btn-outline-secondary finova-btn">

                <i class="fa-solid fa-rotate"></i>
                Refresh

            </button>

        </div>

    </div>


    <!-- ==================================================
         FILTER CARD
    =================================================== -->

    <div class="finova-card account-payable-filter-card mb-1">

        <div class="finova-card-body">

            <div class="row align-items-end g-3">


                <!-- ======================================
                     INVOICE DATE FROM
                ======================================= -->

                <div class="col-md-3">

                    <label
                        for="ap-date-from"
                        class="form-label">

                        Invoice Date From

                    </label>

                    <input
                        type="date"
                        id="ap-date-from"
                        class="form-control finova-control">

                </div>


                <!-- ======================================
                     INVOICE DATE TO
                ======================================= -->

                <div class="col-md-3">

                    <label
                        for="ap-date-to"
                        class="form-label">

                        Invoice Date To

                    </label>

                    <input
                        type="date"
                        id="ap-date-to"
                        class="form-control finova-control">

                </div>


                <!-- STATUS -->
                <div class="col-md-3">
                    <label for="ap-status-filter" class="form-label">Status</label>
                    <select id="ap-status-filter" class="form-select finova-control">
                        <option value="all">Semua Status</option>
                        <option value="paid">Lunas</option>
                        <option value="unpaid">Belum Lunas</option>
                        <option value="partial_paid">Dibayar Sebagian</option>
                    </select>
                </div>

                <!-- ======================================
                     KEYWORD
                ======================================= -->

                <div class="col-md-3">

                    <label
                        for="ap-keyword"
                        class="form-label">

                        Keyword

                    </label>

                    <div class="input-group">

                        <input
                            type="text"
                            id="ap-keyword"
                            class="form-control finova-control"
                            placeholder="Ketik pemasok, invoice, jurnal, PO, deskripsi...">



                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- ==================================================
         ACCOUNT PAYABLE DATA TABLE
    =================================================== -->

    <div
        class="finova-card finova-table-card account-payable-table-card">

        <div class="finova-card-body no-padding">

            <div class="finova-table-container">

                <div class="table-responsive">

                    <table
                        class="table finova-table table-hover align-middle mb-0">


                        <!-- ==================================
                             TABLE HEADER
                        =================================== -->

                        <thead>

                            <tr>


                                <!-- ==========================
                                     NO
                                =========================== -->

                                <th
                                    class="finova-table-index ap-col-no">

                                    No

                                </th>


                                <!-- ==========================
                                     DOCUMENT
                                =========================== -->

                                <th
                                    class="finova-table-name ap-col-document">

                                    Document

                                </th>


                                <!-- ==========================
                                     VENDOR / DESCRIPTION
                                =========================== -->

                                <th
                                    class="finova-table-name ap-col-vendor">

                                    Vendor / Description

                                </th>


                                <!-- ==========================
                                     DATE INFORMATION
                                =========================== -->

                                <th
                                    class="finova-table-name ap-col-date-info">

                                    Date Information

                                </th>


                                <!-- ==========================
                                     AMOUNT / STATUS
                                =========================== -->

                                <th
                                    class="finova-table-name ap-col-amount-status">

                                    Amount / Status

                                </th>


                                <!-- ==========================
                                     ACTION
                                =========================== -->

                                <th
                                    class="finova-table-action ap-col-action">

                                    Action

                                </th>


                            </tr>

                        </thead>


                        <!-- ==================================
                             TABLE BODY
                        =================================== -->

                        <tbody id="ap-table-body">

                            <!--
                            ======================================
                            DATA ROWS WILL BE RENDERED BY
                            account-payable.js
                            ======================================
                            -->

                        </tbody>


                    </table>

                </div>


                <!-- ==================================================
                     GLOBAL PAGINATION
                =================================================== -->

                <div class="finova-pagination-wrapper">

                    <div class="finova-pagination-left">


                        <!-- ==============================
                             FIRST
                        =============================== -->

                        <button
                            type="button"
                            id="ap-page-first"
                            class="finova-pagination-btn"
                            title="First Page"
                            disabled>

                            <i class="fa-solid fa-angles-left"></i>

                        </button>


                        <!-- ==============================
                             PREVIOUS
                        =============================== -->

                        <button
                            type="button"
                            id="ap-page-prev"
                            class="finova-pagination-btn"
                            title="Previous Page"
                            disabled>

                            <i class="fa-solid fa-angle-left"></i>

                        </button>


                        <!-- ==============================
                             PAGE
                        =============================== -->

                        <span class="finova-pagination-label">

                            Page

                        </span>


                        <!-- ==============================
                             CURRENT PAGE
                        =============================== -->

                        <input
                            type="number"
                            id="ap-current-page"
                            class="finova-pagination-input"
                            value="1"
                            min="1"
                            step="1"
                            autocomplete="off"
                            title="Enter page number">


                        <!-- ==============================
                             OF
                        =============================== -->

                        <span class="finova-pagination-label">

                            of

                        </span>


                        <!-- ==============================
                             TOTAL PAGE
                        =============================== -->

                        <span
                            id="ap-total-pages"
                            class="finova-pagination-total">

                            1

                        </span>


                        <!-- ==============================
                             NEXT
                        =============================== -->

                        <button
                            type="button"
                            id="ap-page-next"
                            class="finova-pagination-btn"
                            title="Next Page"
                            disabled>

                            <i class="fa-solid fa-angle-right"></i>

                        </button>


                        <!-- ==============================
                             LAST
                        =============================== -->

                        <button
                            type="button"
                            id="ap-page-last"
                            class="finova-pagination-btn"
                            title="Last Page"
                            disabled>

                            <i class="fa-solid fa-angles-right"></i>

                        </button>

                    </div>


                    <!-- ==============================
                         RECORD INFO
                    =============================== -->

                    <div
                        id="ap-record-info"
                        class="finova-pagination-info">

                        Data 0 - 0 dari 0

                    </div>

                </div>

            </div>
            <!-- END finova-table-container -->

        </div>
        <!-- END finova-card-body -->

    </div>
    <!-- END account-payable-table-card -->

</div>
<!-- END account-payable-page -->
