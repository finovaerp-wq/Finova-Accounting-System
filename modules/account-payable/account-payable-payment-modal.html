<!--
==========================================================
FINOVA ACCOUNTING SYSTEM
MODULE    : ACCOUNT PAYABLE
COMPONENT : PAYMENT MODAL

FINAL :
- SAME VISUAL AS AR PAYMENT
- ADD PO NO
- DESCRIPTION FULL WIDTH
- PAYMENT SUMMARY SAME AS AR
==========================================================
-->


<div
    class="modal fade"
    id="accountPayablePaymentModal"
    tabindex="-1"
    aria-hidden="true"
    data-bs-backdrop="static"
    data-bs-keyboard="false"
>


    <div
        class="
            modal-dialog
            modal-lg
            modal-dialog-centered
        "
    >


        <div class="modal-content">


            <!-- ==================================================
                 HEADER
            =================================================== -->

            <div class="modal-header">


                <div>


                    <h5
                        class="
                            modal-title
                            fw-semibold
                        "
                    >

                        <i
                            class="
                                fa-solid
                                fa-money-bill-transfer
                                me-2
                            "
                        ></i>

                        AP Payment

                    </h5>


                    <div
                        class="
                            text-muted
                            small
                            mt-1
                        "
                    >

                        Create payment for completed Account Payable

                    </div>


                </div>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                >
                </button>


            </div>


            <!-- ==================================================
                 BODY
            =================================================== -->

            <div class="modal-body">


                <!-- ==================================================
                     ACCOUNT PAYABLE ID
                =================================================== -->

                <input
                    type="hidden"
                    id="ap-payment-ap-id"
                >


                <!-- ==================================================
                     INVOICE / VENDOR
                =================================================== -->

                <div class="row g-3">


                    <!-- ==============================================
                         INVOICE NO
                    =============================================== -->

                    <div class="col-md-6">


                        <label
                            for="ap-payment-invoice-no"
                            class="form-label"
                        >

                            Invoice No

                        </label>


                        <input
                            type="text"
                            id="ap-payment-invoice-no"
                            class="form-control"
                            readonly
                        >


                    </div>


                    <!-- ==============================================
                         VENDOR
                    =============================================== -->

                    <div class="col-md-6">


                        <label
                            for="ap-payment-vendor"
                            class="form-label"
                        >

                            Vendor

                        </label>


                        <input
                            type="text"
                            id="ap-payment-vendor"
                            class="form-control"
                            readonly
                        >


                    </div>


                </div>


                <!-- ==================================================
                     PO NO / PAYMENT DATE
                =================================================== -->

                <div class="row g-3 mt-1">


                    <!-- ==============================================
                         PO NO
                    =============================================== -->

                    <div class="col-md-6">


                        <label
                            for="ap-payment-po-no"
                            class="form-label"
                        >

                            PO No

                        </label>


                        <input
                            type="text"
                            id="ap-payment-po-no"
                            class="form-control"
                            readonly
                        >


                    </div>


                    <!-- ==============================================
                         PAYMENT DATE
                    =============================================== -->

                    <div class="col-md-6">


                        <label
                            for="ap-payment-date"
                            class="form-label"
                        >

                            Payment Date

                            <span class="text-danger">

                                *

                            </span>

                        </label>


                        <input
                            type="date"
                            id="ap-payment-date"
                            class="form-control"
                        >


                    </div>


                </div>


                <!-- ==================================================
                     BANK ACCOUNT
                =================================================== -->

                <div class="row g-3 mt-1">


                    <div class="col-12">


                        <label
                            for="ap-payment-bank-account"
                            class="form-label"
                        >

                            Bank Account

                            <span class="text-danger">

                                *

                            </span>

                        </label>


                        <select
                            id="ap-payment-bank-account"
                            class="form-select"
                        >

                            <option value="">

                                Select Bank Account

                            </option>

                        </select>


                    </div>


                </div>


                <!-- ==================================================
                     PAYMENT CALCULATION
                     SAME AS AR PAYMENT
                =================================================== -->

                <div
                    class="
                        ap-payment-summary
                        mt-4
                    "
                >


                    <!-- ==============================================
                         DPP
                    =============================================== -->

                    <div class="ap-payment-summary-line">


                        <span class="ap-payment-summary-label">

                            DPP

                        </span>


                        <strong
                            id="ap-payment-dpp"
                            class="ap-payment-summary-value"
                        >

                            0

                        </strong>


                    </div>


                    <!-- ==============================================
                         TAX (+)
                    =============================================== -->

                    <div class="ap-payment-summary-line">


                        <span class="ap-payment-summary-label">

                            Tax (+)

                        </span>


                        <strong
                            id="ap-payment-tax-plus"
                            class="ap-payment-summary-value"
                        >

                            0

                        </strong>


                    </div>


                    <!-- ==============================================
                         TAX (-)
                    =============================================== -->

                    <div class="ap-payment-summary-line">


                        <span class="ap-payment-summary-label">

                            Tax (-)

                        </span>


                        <strong
                            id="ap-payment-tax-minus"
                            class="ap-payment-summary-value"
                        >

                            0

                        </strong>


                    </div>


                    <!-- ==============================================
                         DIVIDER
                    =============================================== -->

                    <div class="ap-payment-summary-divider">
                    </div>


                    <!-- ==============================================
                         PAYMENT AMOUNT
                    =============================================== -->

                    <div
                        class="
                            row
                            g-3
                            align-items-center
                        "
                    >


                        <!-- LEFT -->

                        <div class="col-md-6">


                            <label
                                for="ap-payment-amount"
                                class="
                                    form-label
                                    fw-semibold
                                    mb-1
                                "
                            >

                                Payment Amount

                                <span class="text-danger">

                                    *

                                </span>

                            </label>


                            <div
                                class="
                                    small
                                    text-muted
                                "
                            >

                                Maximum payment is current outstanding.

                            </div>


                        </div>


                        <!-- RIGHT -->

                        <div class="col-md-6">


                            <input
                                type="text"
                                id="ap-payment-amount"
                                class="
                                    form-control
                                    ap-payment-amount
                                "
                                inputmode="numeric"
                                autocomplete="off"
                                placeholder="0"
                            >


                        </div>


                    </div>


                </div>


                <!-- ==================================================
                     REFERENCE NO
                =================================================== -->

                <div class="row g-3 mt-1">


                    <div class="col-12">


                        <label
                            for="ap-payment-reference-no"
                            class="form-label"
                        >

                            Reference No

                        </label>


                        <input
                            type="text"
                            id="ap-payment-reference-no"
                            class="form-control"
                            placeholder="Transfer / payment reference"
                            autocomplete="off"
                        >


                    </div>


                </div>


                <!-- ==================================================
                     DESCRIPTION
                     FULL WIDTH
                =================================================== -->

                <div class="row g-3 mt-1">


                    <div class="col-12">


                        <label
                            for="ap-payment-description"
                            class="form-label"
                        >

                            Description

                        </label>


                        <textarea
                            id="ap-payment-description"
                            class="
                                form-control
                                ap-payment-description
                            "
                            rows="4"
                            placeholder="Payment description"
                        ></textarea>


                    </div>


                </div>


                <!-- ==================================================
                     JOURNAL PREVIEW
                =================================================== -->

                <div
                    class="
                        ap-payment-journal-preview
                        alert
                        alert-light
                        border
                        mt-4
                        mb-0
                    "
                >


                    <div
                        class="
                            fw-semibold
                            mb-2
                        "
                    >

                        Journal Preview

                    </div>


                    <!-- ==============================================
                         DPP
                    =============================================== -->

                    <div
                        class="
                            small
                            text-muted
                            mb-1
                        "
                    >

                        DPP:

                        <strong>

                            HUTANG USAHA → BANK

                        </strong>

                    </div>


                    <!-- ==============================================
                         TAX (+)
                    =============================================== -->

                    <div
                        class="
                            small
                            text-muted
                            mb-1
                        "
                    >

                        Tax (+):

                        <strong>

                            HUTANG USAHA → BANK

                        </strong>

                    </div>


                    <!-- ==============================================
                         TAX (-)
                    =============================================== -->

                    <div
                        class="
                            small
                            text-muted
                        "
                    >

                        Tax (-):

                        <strong>

                            BANK → HUTANG USAHA

                        </strong>

                    </div>


                    <div
                        class="
                            small
                            text-muted
                            mt-2
                        "
                    >

                        Payment GL Journal will be generated as

                        <strong>

                            Draft

                        </strong>.

                    </div>


                </div>


            </div>


            <!-- ==================================================
                 FOOTER
            =================================================== -->

            <div class="modal-footer">


                <!-- ==============================================
                     CANCEL
                =============================================== -->

                <button
                    type="button"
                    class="btn btn-outline-secondary"
                    data-bs-dismiss="modal"
                >

                    Cancel

                </button>


                <!-- ==============================================
                     RECEIVE PAYMENT
                =============================================== -->

                <button
                    type="button"
                    class="btn btn-success"
                    id="btn-save-ap-payment"
                >

                    <i
                        class="
                            fa-solid
                            fa-money-bill-wave
                            me-1
                        "
                    ></i>

                    Receive Payment

                </button>


            </div>


        </div>


    </div>


</div>
