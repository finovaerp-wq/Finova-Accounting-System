<div
    class="modal fade"
    id="businessPartnerModal"
    tabindex="-1"
    data-bs-backdrop="static"
    data-bs-keyboard="false">

    <div class="modal-dialog modal-xl">

        <div class="modal-content">

            <!-- ==========================================
                 HEADER
            =========================================== -->

            <div class="modal-header">

                <h5
                    id="businessPartnerModalTitle"
                    class="modal-title">

                    Add Business Partner

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>

            </div>

            <!-- ==========================================
                 BODY
            =========================================== -->

            <div class="modal-body">

                <form id="businessPartnerForm">

                    <input
                        type="hidden"
                        id="bp-id">

                    <div class="row g-3">

                        <!-- Business Partner Name -->

                        <div class="col-md-12">

                            <label
                                for="bp-name"
                                class="form-label">

                                Business Partner Name
                                <span class="text-danger">*</span>

                            </label>

                            <input
                                type="text"
                                id="bp-name"
                                class="form-control"
                                maxlength="200"
                                placeholder="Exp: PT.XXXX"
                                required>

                        </div>

                        <!-- Type -->

                        <div class="col-md-4">

                            <label
                                for="bp-type-form"
                                class="form-label">

                                Type

                            </label>

                            <select
                                id="bp-type-form"
                                class="form-select">

                                <option value="Customer">Customer</option>
                                <option value="Vendor">Vendor</option>
                                <option value="Employee">Employee</option>

                            </select>

                        </div>

                        <!-- Term Of Payment -->

                        <div class="col-md-4">

                            <label
                                for="bp-top-id"
                                class="form-label">

                                Term Of Payment (TOP)

                            </label>

                            <select
                                id="bp-top-id"
                                class="form-select">

                                <option value="">

                                    -- Select TOP --

                                </option>

                            </select>

                        </div>

                        <!-- Status -->

                        <div class="col-md-4">

                            <label
                                for="bp-status-form"
                                class="form-label">

                                Status

                            </label>

                            <select
                                id="bp-status-form"
                                class="form-select">

                                <option value="true">Active</option>
                                <option value="false">Inactive</option>

                            </select>

                        </div>

                        <!-- Phone -->

                        <div class="col-md-4">

                            <label
                                for="bp-phone"
                                class="form-label">

                                Phone Number

                            </label>

                            <input
                            type="text"
                            id="bp-phone"
                            class="form-control"
                            maxlength="50"
                            placeholder="Exp: 08XXXXXXXXX">

                        </div>

                        <!-- Email -->

                        <div class="col-md-4">

                            <label
                                for="bp-email"
                                class="form-label">

                                Email

                            </label>

                            <input
                                type="email"
                                id="bp-email"
                                class="form-control"
                                maxlength="100"
                                placeholder="Exp: Finovaerp@gmail.com">

                        </div>

                        <!-- Tax Number -->

                        <div class="col-md-4">

                            <label
                                for="bp-tax-number"
                                class="form-label">

                                NPWP 16 Digit/NIK

                            </label>

                            <input
                                type="text"
                                id="bp-tax-number"
                                class="form-control"
                                maxlength="30"
                                placeholder="Exp: XXXX XXXX XXXX XXXX">

                        </div>

                        <!-- Address -->

                        <div class="col-md-12">

                            <label
                                for="bp-address"
                                class="form-label">

                                Address

                            </label>

                            <textarea
                                id="bp-address"
                                class="form-control"
                                rows="3"
                                placeholder="Exp: JL. Raya Bekasi......."></textarea>

                        </div>

                        <!-- City -->

                        <div class="col-md-6">

                            <label
                                for="bp-city"
                                class="form-label">

                                City

                            </label>

                            <input
                                type="text"
                                id="bp-city"
                                class="form-control"
                                maxlength="100"
                                placeholder="Exp: Kota Bekasi">

                        </div>

                        <!-- Country -->

                        <div class="col-md-6">

                            <label
                                for="bp-country"
                                class="form-label">

                                Country

                            </label>

                            <input
                                type="text"
                                id="bp-country"
                                class="form-control"
                                value="Indonesia"
                                readonly>

                        </div>
                    </div>

                    <!-- ==========================================
                         BANK ACCOUNT
                    =========================================== -->

                    <hr class="my-4">

                    <div
                        class="d-flex justify-content-between align-items-center mb-3">

                        <h5 class="mb-3">

                            Bank Accounts
                            <span class="text-danger">*</span>

                        </h5>

                        <button
                            type="button"
                            id="btn-add-bank-row"
                            class="btn btn-primary btn-sm">

                            <i class="fa-solid fa-plus me-1"></i>

                            Add Bank

                        </button>

                    </div>

                    <div class="table-responsive">

                        <table
                            class="table table-bordered table-hover align-middle">

                            <thead class="table-light">

                                <tr>

                                    <th style="width:18%;">
                                        Bank
                                    </th>

                                    <th style="width:24%;">
                                        Account Holder
                                    </th>

                                    <th style="width:20%;">
                                        Account Number
                                    </th>

                                    <th style="width:15%;">
                                        Branch
                                    </th>

                                    <th style="width:12%;">
                                        Purpose
                                    </th>

                                    <th style="width:8%;" class="text-center">
                                        Default
                                    </th>

                                    <th style="width:3%;" class="text-center">

                                    </th>

                                </tr>

                            </thead>

                            <tbody id="bp-bank-table">

                                <!-- Dynamic Row -->

                            </tbody>

                        </table>

                    </div>

                </form>

            </div>

            <!-- ==========================================
                 FOOTER
            =========================================== -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    type="button"
                    id="btn-save-business-partner"
                    class="btn btn-primary">

                    <i class="fa-solid fa-floppy-disk me-1"></i>

                    Save

                </button>

            </div>

        </div>

    </div>

</div>
<!-- ==========================================================
     DELETE BUSINESS PARTNER CONFIRMATION
=========================================================== -->

<div
    class="modal fade"
    id="bpDeleteModal"
    tabindex="-1"
    aria-labelledby="bpDeleteModalLabel"
    aria-hidden="true">

    <div
        class="modal-dialog modal-dialog-centered">

        <div class="modal-content shadow-lg">


            <!-- ==================================================
                 HEADER
            =================================================== -->

            <div class="modal-header">

                <h5
                    class="modal-title fw-semibold"
                    id="bpDeleteModalLabel">

                    <i
                        class="fa-solid fa-trash text-danger me-2">
                    </i>

                    Confirm Delete Business Partner

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>

            </div>


            <!-- ==================================================
                 BODY
            =================================================== -->

            <div class="modal-body">

                <div class="text-center">


                    <!-- DELETE ICON -->

                    <div class="mb-3">

                        <i
                            class="fa-solid fa-trash-can text-danger"
                            style="font-size: 48px;">
                        </i>

                    </div>


                    <!-- QUESTION -->

                    <div
                        class="mb-3"
                        style="font-size: 16px;">

                        Apakah Anda yakin ingin
                        <strong>
                            menghapus Business Partner ini?
                        </strong>

                    </div>


                    <!-- BP INFORMATION -->

                    <div
                        class="table-responsive text-start mb-3">

                        <table
                            class="table table-sm table-bordered mb-0">

                            <tbody>

                                <tr>

                                    <th
                                        style="width: 150px;">

                                        BP Code

                                    </th>

                                    <td
                                        id="bp-delete-code">

                                        -

                                    </td>

                                </tr>


                                <tr>

                                    <th>

                                        BP Name

                                    </th>

                                    <td
                                        id="bp-delete-name">

                                        -

                                    </td>

                                </tr>


                                <tr>

                                    <th>

                                        Type

                                    </th>

                                    <td
                                        id="bp-delete-type">

                                        -

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>


                    <!-- WARNING -->

                    <div
                        class="alert alert-danger text-start mb-0">

                        <i
                            class="fa-solid fa-triangle-exclamation me-2">
                        </i>

                        Business Partner yang dihapus
                        tidak dapat dikembalikan.

                    </div>

                </div>

            </div>


            <!-- ==================================================
                 FOOTER
            =================================================== -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    <i
                        class="fa-solid fa-xmark me-1">
                    </i>

                    Batal

                </button>


                <button
                    type="button"
                    class="btn btn-danger"
                    id="btn-confirm-bp-delete">

                    <i
                        class="fa-solid fa-trash me-1">
                    </i>

                    Ya, Hapus

                </button>

            </div>


        </div>

    </div>

</div>
