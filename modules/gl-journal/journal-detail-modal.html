Journal Detail Modal
Version : 4.0 Enterprise
========================================================== -->

<div
    class="modal fade"
    id="journalDetailModal"
    tabindex="-1"
    data-bs-backdrop="static"
    data-bs-keyboard="false">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <!-- ==========================================
                 HEADER
            =========================================== -->

            <div class="modal-header bg-primary text-white">

                <h5 class="modal-title">

                    <i class="fa-solid fa-plus me-2"></i>

                    Add Journal Detail

                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <!-- ==========================================
                 BODY
            =========================================== -->

            <div class="modal-body">

    <!-- ==========================================
         HIDDEN STATE
    =========================================== -->

    <input
        type="hidden"
        id="detail-id"
        value="">

    <input
        type="hidden"
        id="detail-mode"
        value="add">

    <div class="row g-4">

        <!-- ======================================================
             DESCRIPTION
        ======================================================= -->

        <div class="col-12">

            <label
                for="detail-description"
                class="form-label fw-semibold">

                Description
            </label>

            <textarea
                id="detail-description"
                class="form-control"
                rows="5"
                placeholder="Input journal description..."></textarea>

        </div>

        <!-- ======================================================
             DEBIT ACCOUNT
        ======================================================= -->

        <div class="col-md-6">

            <label
                for="detail-debit-account"
                class="form-label fw-semibold">

                Debit Account
            </label>

            <select
                id="detail-debit-account"
                class="form-select">

                <option value="">

                    -- Select Debit Account --

                </option>

            </select>

        </div>

        <!-- ======================================================
             CREDIT ACCOUNT
        ======================================================= -->

        <div class="col-md-6">

            <label
                for="detail-credit-account"
                class="form-label fw-semibold">

                Credit Account
            </label>

            <select
                id="detail-credit-account"
                class="form-select">

                <option value="">

                    -- Select Credit Account --

                </option>

            </select>

        </div>

        <!-- ======================================================
             AMOUNT
        ======================================================= -->

        <div class="col-md-4">

            <label
                for="detail-amount"
                class="form-label fw-semibold">

                Amount
            </label>

  <input
    type="number"
    id="detail-amount"
    class="form-control text-end"
    value="0"
    min="0"
    step="0.01">

        </div>

        <!-- ======================================================
             BUSINESS PARTNER
        ======================================================= -->

        <div class="col-md-8">

            <label
                for="detail-business-partner"
                class="form-label fw-semibold">

                Business Partner
            </label>

            <select
                id="detail-business-partner"
                class="form-select">

                <option value="">

                    -- Optional --

                </option>

            </select>

        </div>

    </div>

</div>

            <!-- ==========================================
                 FOOTER
            =========================================== -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-light border"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    type="button"
                    id="btn-save-detail-line"
                    class="btn btn-primary">

                    <i class="fa-solid fa-floppy-disk me-2"></i>

                    Save Line

                </button>

            </div>

        </div>

    </div>

</div>
