<!-- ==========================================================
FINOVA ACCOUNTING SYSTEM
Journal Detail Modal
Version : 4.1 Enterprise
Searchable COA
========================================================== -->

<div
    class="modal fade"
    id="journalDetailModal"
    tabindex="-1"
    data-bs-backdrop="static"
    data-bs-keyboard="false">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <!-- ==========================================
                 HEADER
            =========================================== -->

            <div class="modal-header journal-detail-modern-header">

    <div class="d-flex align-items-center gap-3">

        <div class="journal-detail-header-icon">

            <i class="fa-solid fa-plus"></i>

        </div>

        <div>

            <h5 class="modal-title mb-1">

                Add Journal Detail

            </h5>

            <small class="journal-detail-header-subtitle">

                Add debit and credit transaction line

            </small>

        </div>

    </div>

    <button
        type="button"
        class="btn-close"
        data-bs-dismiss="modal"
        aria-label="Close">
    </button>

</div>


            <!-- ==========================================
                 BODY
            =========================================== -->

            <div class="modal-body">


                <!-- ==========================================
                     HIDDEN STATE
                =========================================== -->

                <input
                    type="hidden"
                    id="detail-id"
                    value="">

                <input
                    type="hidden"
                    id="detail-mode"
                    value="add">


                <div class="row g-4">


                    <!-- ======================================================
                         DESCRIPTION
                    ======================================================= -->

                    <div class="col-12">

                        <label
                            for="detail-description"
                            class="form-label fw-semibold">

                            Description

                        </label>

                        <textarea
                            id="detail-description"
                            class="form-control"
                            rows="5"
                            placeholder="Input journal description..."></textarea>

                    </div>


                    <!-- ======================================================
                         DEBIT ACCOUNT
                    ======================================================= -->

                    <div class="col-md-6">

                        <label
                            for="detail-debit-account"
                            class="form-label fw-semibold">

                            Debit Account

                        </label>

                        <select
                            id="detail-debit-account"
                            class="form-select">

                            <option value="">
                                Select Chart of Account
                            </option>

                        </select>

                    </div>


                    <!-- ======================================================
                         CREDIT ACCOUNT
                    ======================================================= -->

                    <div class="col-md-6">

                        <label
                            for="detail-credit-account"
                            class="form-label fw-semibold">

                            Credit Account

                        </label>

                        <select
                            id="detail-credit-account"
                            class="form-select">

                            <option value="">
                                Select Chart of Account
                            </option>

                        </select>

                    </div>


                    <!-- ======================================================
                         AMOUNT
                    ======================================================= -->

                    <div class="col-md-4">

                        <label
                            for="detail-amount"
                            class="form-label fw-semibold">

                            Amount

                        </label>

                        <input
                            type="text"
                            id="detail-amount"
                            class="form-control text-start"
                            inputmode="numeric"
                            placeholder="0"
                            autocomplete="off">

                    </div>


                    <!-- ======================================================
                         BUSINESS PARTNER
                    ======================================================= -->

                    <div class="col-md-8">

                        <label
                            for="detail-business-partner"
                            class="form-label fw-semibold">

                            Business Partner

                        </label>

                        <select
                            id="detail-business-partner"
                            class="form-select">

                            <option value="">
                                -- Optional --
                            </option>

                        </select>

                    </div>


                </div>

            </div>


            <!-- ==========================================
                 FOOTER
            =========================================== -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-light border"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    type="button"
                    id="btn-save-detail-line"
                    class="btn btn-primary">

                    <i class="fa-solid fa-floppy-disk me-2"></i>

                    Save Line

                </button>

            </div>


        </div>

    </div>

</div>
